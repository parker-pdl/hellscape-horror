<script src="./three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
<script>
(function(){
  const hasWebGL=(function(){try{const c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;}})();
  const loadwrap=document.getElementById('loadwrap');
  if(!hasWebGL||typeof THREE==='undefined'){ loadwrap.querySelector('.t').textContent='WebGL not available in this browser.'; return; }

  // ---------------- renderer / scene ----------------
  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  const scene=new THREE.Scene();
  const FOG=0x0b0402;
  const FOG_BASE=0.055, FOG_DEEP=0.1;
  scene.fog=new THREE.FogExp2(FOG,FOG_BASE);
  scene.background=new THREE.Color(FOG);

  const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,0.05,140);
  camera.rotation.order='YXZ';
  const EYE=1.62;
  const player={x:0,z:2.5,yaw:0,pitch:0,elev:0};   // start looking down -z (into the hall)
  camera.position.set(player.x,EYE,player.z);

  // ---------------- procedural textures ----------------
  function noiseCanvas(size,base,contrast){
    const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    const img=x.createImageData(size,size),d=img.data;
    // value noise via random + smoothing octaves
    function grid(step){const g=[];for(let i=0;i<(size/step+2)*(size/step+2);i++)g.push(Math.random());return g;}
    const layers=[[32,.5],[12,.32],[4,.18]].map(([st,w])=>({st,w,g:grid(st)}));
    for(let y=0;y<size;y++)for(let x2=0;x2<size;x2++){
      let n=0,wsum=0;
      for(const L of layers){const gx=x2/L.st,gy=y/L.st,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy,w=Math.floor(size/L.st)+2;
        const a=L.g[iy*w+ix],b=L.g[iy*w+ix+1],c2=L.g[(iy+1)*w+ix],dd=L.g[(iy+1)*w+ix+1];
        const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
        const val=(a*(1-sx)+b*sx)*(1-sy)+(c2*(1-sx)+dd*sx)*sy;
        n+=val*L.w;wsum+=L.w;}
      n/=wsum; n=(n-0.5)*contrast+0.5; n=Math.max(0,Math.min(1,n));
      const p=(y*size+x2)*4; d[p]=d[p+1]=d[p+2]=n*255; d[p+3]=255;
    }
    x.putImageData(img,0,0);
    return c;
  }
  // stone: diffuse (with mortar joints + cracks) + normal derived from luminance
  function stoneMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.5,1.6); const hx=hc.getContext('2d');
    // brick mortar joints (darker grooves)
    hx.strokeStyle='rgba(0,0,0,.55)';hx.lineWidth=3;
    for(let y=32;y<size;y+=42){hx.beginPath();hx.moveTo(0,y);hx.lineTo(size,y);hx.stroke();}
    for(let y=32,row=0;y<size;y+=42,row++){const off=row%2?21:0;for(let xx=off;xx<size;xx+=52){hx.beginPath();hx.moveTo(xx,y);hx.lineTo(xx,y+42);hx.stroke();}}
    // cracks
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=1.4;
    for(let i=0;i<26;i++){let px=Math.random()*size,py=Math.random()*size;hx.beginPath();hx.moveTo(px,py);
      for(let k=0;k<5;k++){px+=(Math.random()-.5)*40;py+=(Math.random()-.5)*40;hx.lineTo(px,py);}hx.stroke();}
    // diffuse: tint the height toward cold dark stone with warm grime
    const dc=document.createElement('canvas');dc.width=dc.height=size;const dx=dc.getContext('2d');
    const src=hx.getImageData(0,0,size,size).data;const dimg=dx.createImageData(size,size),dd=dimg.data;
    for(let i=0;i<size*size;i++){const h=src[i*4]/255;
      const r=18+h*70+ (Math.random()<.02?40:0), g=15+h*54, b=14+h*46;
      dd[i*4]=r;dd[i*4+1]=g;dd[i*4+2]=b;dd[i*4+3]=255;}
    dx.putImageData(dimg,0,0);
    // normal map from height luminance gradient
    const nc=document.createElement('canvas');nc.width=nc.height=size;const nx=nc.getContext('2d');
    const nimg=nx.createImageData(size,size),nd=nimg.data;const S=2.2;
    const H=(x,y)=>src[((((y+size)%size)*size)+((x+size)%size))*4]/255;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const dxv=(H(x-1,y)-H(x+1,y))*S, dyv=(H(x,y-1)-H(x,y+1))*S;
      let nxv=dxv,nyv=dyv,nzv=1; const len=Math.hypot(nxv,nyv,nzv);nxv/=len;nyv/=len;nzv/=len;
      const p=(y*size+x)*4; nd[p]=(nxv*.5+.5)*255; nd[p+1]=(nyv*.5+.5)*255; nd[p+2]=(nzv*.5+.5)*255; nd[p+3]=255;}
    nx.putImageData(nimg,0,0);
    const map=new THREE.CanvasTexture(dc), nrm=new THREE.CanvasTexture(nc);
    [map,nrm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
    return {map,nrm};
  }
  // cave rock: organic cracks + damp blotches, cooler palette, no brick grid
  function caveMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.46,2.0); const hx=hc.getContext('2d');
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=1.6;
    for(let i=0;i<34;i++){let px=Math.random()*size,py=Math.random()*size;hx.beginPath();hx.moveTo(px,py);
      for(let k=0;k<6;k++){px+=(Math.random()-.5)*44;py+=(Math.random()-.5)*44;hx.lineTo(px,py);}hx.stroke();}
    for(let i=0;i<10;i++){const px=Math.random()*size,py=Math.random()*size,r=10+Math.random()*30;
      const gr=hx.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
      hx.fillStyle=gr;hx.beginPath();hx.arc(px,py,r,0,7);hx.fill();}
    const dc=document.createElement('canvas');dc.width=dc.height=size;const dx=dc.getContext('2d');
    const src=hx.getImageData(0,0,size,size).data;const dimg=dx.createImageData(size,size),dd=dimg.data;
    for(let i=0;i<size*size;i++){const h=src[i*4]/255;
      const r=12+h*46, gg=16+h*56+(Math.random()<.015?26:0), b=15+h*50;
      dd[i*4]=r;dd[i*4+1]=gg;dd[i*4+2]=b;dd[i*4+3]=255;}
    dx.putImageData(dimg,0,0);
    const nc=document.createElement('canvas');nc.width=nc.height=size;const nx=nc.getContext('2d');
    const nimg=nx.createImageData(size,size),nd=nimg.data;const S=2.6;
    const H2=(x,y)=>src[((((y+size)%size)*size)+((x+size)%size))*4]/255;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const dxv=(H2(x-1,y)-H2(x+1,y))*S, dyv=(H2(x,y-1)-H2(x,y+1))*S;
      let nxv=dxv,nyv=dyv,nzv=1; const len=Math.hypot(nxv,nyv,nzv);nxv/=len;nyv/=len;nzv/=len;
      const p=(y*size+x)*4; nd[p]=(nxv*.5+.5)*255; nd[p+1]=(nyv*.5+.5)*255; nd[p+2]=(nzv*.5+.5)*255; nd[p+3]=255;}
    nx.putImageData(nimg,0,0);
    const map=new THREE.CanvasTexture(dc), nrm=new THREE.CanvasTexture(nc);
    [map,nrm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
    return {map,nrm};
  }
  // boiler metal: riveted panel seams + rust blotches
  function boilerMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.5,1.3); const hx=hc.getContext('2d');
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=3;
    for(let y=0;y<size;y+=64){hx.beginPath();hx.moveTo(0,y);hx.lineTo(size,y);hx.stroke();}
    for(let x=0;x<size;x+=64){hx.beginPath();hx.moveTo(x,0);hx.lineTo(x,size);hx.stroke();}
    hx.fillStyle='rgba(0,0,0,.5)';
    for(let y=0;y<size;y+=64)for(let x=0;x<size;x+=64){
      hx.beginPath();hx.arc(x+6,y+6,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+58,y+6,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+6,y+58,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+58,y+58,2.4,0,7);hx.fill();
    }
    for(let i=0;i<16;i++){const px=Math.random()*size,py=Math.random()*size,r=6+Math.random()*22;
      const gr=hx.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,'rgba(120,50,10,.5)');gr.addColorStop(1,'rgba(120,50,10,0)');
      hx.fillStyle=gr;hx.beginPath();hx.arc(px,py,r,0,7);hx.fill();}
    const dc=document.createElement('canvas');dc.width=dc.height=size;const dx=dc.getContext('2d');
    const src=hx.getImageData(0,0,size,size).data;const dimg=dx.createImageData(size,size),dd=dimg.data;
    for(let i=0;i<size*size;i++){const h=src[i*4]/255;
      const r=30+h*48, gg=27+h*42, b=25+h*38;
      dd[i*4]=r;dd[i*4+1]=gg;dd[i*4+2]=b;dd[i*4+3]=255;}
    dx.putImageData(dimg,0,0);
    const nc=document.createElement('canvas');nc.width=nc.height=size;const nx=nc.getContext('2d');
    const nimg=nx.createImageData(size,size),nd=nimg.data;const S=2.4;
    const H2=(x,y)=>src[((((y+size)%size)*size)+((x+size)%size))*4]/255;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const dxv=(H2(x-1,y)-H2(x+1,y))*S, dyv=(H2(x,y-1)-H2(x,y+1))*S;
      let nxv=dxv,nyv=dyv,nzv=1; const len=Math.hypot(nxv,nyv,nzv);nxv/=len;nyv/=len;nzv/=len;
      const p=(y*size+x)*4; nd[p]=(nxv*.5+.5)*255; nd[p+1]=(nyv*.5+.5)*255; nd[p+2]=(nzv*.5+.5)*255; nd[p+3]=255;}
    nx.putImageData(nimg,0,0);
    const map=new THREE.CanvasTexture(dc), nrm=new THREE.CanvasTexture(nc);
    [map,nrm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
    return {map,nrm};
  }
  function lavaTex(){
    const size=256,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    x.fillStyle='#160402';x.fillRect(0,0,size,size);
    // veins
    for(let i=0;i<40;i++){let px=Math.random()*size,py=Math.random()*size;
      const grd=x.createLinearGradient(px,py,px+30,py+30);grd.addColorStop(0,'#ff2a00');grd.addColorStop(1,'#ffd23a');
      x.strokeStyle=grd;x.lineWidth=1+Math.random()*3;x.shadowColor='#ff5a00';x.shadowBlur=10;x.beginPath();x.moveTo(px,py);
      for(let k=0;k<4;k++){px+=(Math.random()-.5)*46;py+=(Math.random()-.5)*46;x.lineTo(px,py);}x.stroke();}
    x.shadowBlur=0;
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
  }
  function glowTex(col){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,col);g.addColorStop(.3,col);g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(s/2,s/2,s/2,0,7);x.fill();return new THREE.CanvasTexture(c);}
  function flameTex(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    const g=x.createRadialGradient(s/2,s*0.62,0,s/2,s*0.55,s*0.5);
    g.addColorStop(0,'#fff2c0');g.addColorStop(.3,'#ffb43a');g.addColorStop(.6,'#ff5a12');g.addColorStop(1,'rgba(80,0,0,0)');
    x.fillStyle=g;x.beginPath();x.ellipse(s/2,s*0.55,s*0.32,s*0.48,0,0,7);x.fill();return new THREE.CanvasTexture(c);}
  // blood decal: blotch near the top + tapering drip streaks trailing down (randomized per call)
  function bloodTex(){
    const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.clearRect(0,0,s,s);
    for(let i=0;i<5;i++){
      const px=s*0.5+(Math.random()-.5)*40,py=s*0.14+(Math.random()-.5)*20,r=18+Math.random()*22;
      const g=x.createRadialGradient(px,py,0,px,py,r);
      g.addColorStop(0,'rgba(90,0,4,.95)');g.addColorStop(.6,'rgba(70,0,3,.75)');g.addColorStop(1,'rgba(50,0,2,0)');
      x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
    }
    const nDrips=6+Math.floor(Math.random()*5);
    for(let i=0;i<nDrips;i++){
      const dx0=s*0.5+(Math.random()-.5)*70, y0=s*0.2+Math.random()*30;
      const len=60+Math.random()*(s*0.7), w0=3+Math.random()*5;
      x.beginPath();
      x.moveTo(dx0-w0/2,y0);
      x.quadraticCurveTo(dx0+(Math.random()-.5)*10, y0+len*0.5, dx0+(Math.random()-.5)*6, y0+len);
      x.lineTo(dx0+(Math.random()-.5)*6+1.5, y0+len);
      x.quadraticCurveTo(dx0+(Math.random()-.5)*10+w0, y0+len*0.5, dx0+w0/2, y0);
      x.closePath();
      const g=x.createLinearGradient(0,y0,0,y0+len);
      g.addColorStop(0,'rgba(80,0,3,.9)');g.addColorStop(1,'rgba(60,0,2,0)');
      x.fillStyle=g;x.fill();
      x.beginPath();x.arc(dx0,y0+len,w0*0.8,0,7);x.fillStyle='rgba(80,0,3,.85)';x.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  function steamTex(){
    const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(220,220,220,.55)');g.addColorStop(.5,'rgba(200,200,200,.22)');g.addColorStop(1,'rgba(200,200,200,0)');
    x.fillStyle=g;x.beginPath();x.arc(s/2,s/2,s/2,0,7);x.fill();
    return new THREE.CanvasTexture(c);
  }
  function stairStripeTex(n){
    const w=64,h=256,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.clearRect(0,0,w,h);
    x.fillStyle='rgba(0,0,0,.5)';
    for(let i=0;i<n;i++){const y=(i+0.5)*(h/n);x.fillRect(0,y-2,w,4);}
    return new THREE.CanvasTexture(c);
  }

  const stone=stoneMaps();
  const cave=caveMaps();
  const boiler=boilerMaps();
  const lavaT=lavaTex();
  const emberTex=glowTex('rgba(255,170,80,1)');
  const haloTex=glowTex('rgba(255,140,50,1)');
  const flameT=flameTex();
  const steamT=steamTex();
  const dropTex=glowTex('rgba(150,10,16,1)');

  function stoneMat(rep,tint){
    const m=stone.map.clone(); m.needsUpdate=true; m.repeat.set(rep[0],rep[1]);
    const n=stone.nrm.clone(); n.needsUpdate=true; n.repeat.set(rep[0],rep[1]);
    return new THREE.MeshStandardMaterial({map:m,normalMap:n,color:tint||0xffffff,roughness:.96,metalness:.04,
      normalScale:new THREE.Vector2(1.1,1.1)});
  }
  function caveMat(rep,tint){
    const m=cave.map.clone(); m.needsUpdate=true; m.repeat.set(rep[0],rep[1]);
    const n=cave.nrm.clone(); n.needsUpdate=true; n.repeat.set(rep[0],rep[1]);
    return new THREE.MeshStandardMaterial({map:m,normalMap:n,color:tint||0xffffff,roughness:1.0,metalness:.02,
      normalScale:new THREE.Vector2(1.3,1.3)});
  }
  function boilerMat(rep,tint){
    const m=boiler.map.clone(); m.needsUpdate=true; m.repeat.set(rep[0],rep[1]);
    const n=boiler.nrm.clone(); n.needsUpdate=true; n.repeat.set(rep[0],rep[1]);
    return new THREE.MeshStandardMaterial({map:m,normalMap:n,color:tint||0xffffff,roughness:.55,metalness:.4,
      normalScale:new THREE.Vector2(1.0,1.0)});
  }

  // ---------------- geometry: the hall ----------------
  const HW=4.6, H=6, LEN=58, ZEND=-LEN+4;   // half width, height, length
  const g=new THREE.Group();scene.add(g);

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,LEN), stoneMat([3,10],0x6b5442));
  floor.rotation.x=-Math.PI/2; floor.position.set(0,0,2.5-LEN/2); floor.receiveShadow=true; g.add(floor);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,LEN), stoneMat([3,10],0x2a1c14));
  ceil.rotation.x=Math.PI/2; ceil.position.set(0,H,2.5-LEN/2); ceil.receiveShadow=true; g.add(ceil);

  // ---- junction: a gap opens in each side wall so the player can peel off left/right ----
  const JZ=-42.5;                // junction center z on hall A
  const GAPH=4.0;                 // half-length of each wall opening (matches wing corridor width)
  function sideWallPiece(s,zTop,zBot){ // zTop must be > zBot
    const len=zTop-zBot; if(len<=0.02) return;
    const wmesh=new THREE.Mesh(new THREE.PlaneGeometry(len,H), stoneMat([len/5.8,2],0x5a4636));
    wmesh.rotation.y=s*Math.PI/2; wmesh.position.set(s*HW,H/2,(zTop+zBot)/2); wmesh.receiveShadow=true; wmesh.castShadow=true; g.add(wmesh);
  }
  for(const s of [-1,1]){
    sideWallPiece(s, 2.5, JZ+GAPH);
    sideWallPiece(s, JZ-GAPH, 2.5-LEN);
  }

  // lava trench strips along the base of each wall (glow)
  const lavaMat=new THREE.MeshStandardMaterial({map:lavaT,emissiveMap:lavaT,emissive:0xff4a10,emissiveIntensity:2.3,color:0x3a0a02,roughness:.6});
  lavaMat.map.repeat.set(2,18);lavaMat.emissiveMap.repeat.set(2,18);
  for(const s of [-1,1]){
    const l=new THREE.Mesh(new THREE.PlaneGeometry(0.7,LEN),lavaMat);
    l.rotation.x=-Math.PI/2; l.position.set(s*(HW-0.42),0.02,2.5-LEN/2); g.add(l);
  }

  // pillars + wall torches (i=4 and i=5 rows straddle the junction gap and are skipped naturally by spacing)
  const pillarMat=stoneMat([1,2],0x4a3a2c);
  const torchLights=[];
  const flames=[];
  for(let i=0;i<6;i++){
    const z=-2 - i*9;
    if(z>JZ-GAPH-1.2 && z<JZ+GAPH+1.2) continue; // keep the junction opening clear of pillars
    for(const s of [-1,1]){
      const col=new THREE.Mesh(new THREE.BoxGeometry(0.9,H,0.9),pillarMat);
      col.position.set(s*(HW-0.55),H/2,z); col.castShadow=true; col.receiveShadow=true; g.add(col);
      // torch on inner face of alternating pillars
      if((i+ (s>0?0:1))%2===0){
        const bracket=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,0.5,6),new THREE.MeshStandardMaterial({color:0x120a06,roughness:.9}));
        bracket.position.set(s*(HW-1.0),3.0,z); bracket.rotation.z=s*0.5; g.add(bracket);
        const fl=new THREE.Sprite(new THREE.SpriteMaterial({map:flameT,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
        fl.position.set(s*(HW-1.15),3.35,z); fl.scale.set(0.9,1.3,1); g.add(fl);
        const pl=new THREE.PointLight(0xff7a30,2.0,15,2); pl.position.set(s*(HW-1.15),3.4,z); g.add(pl);
        torchLights.push({pl,base:2.0}); flames.push({fl,base:1.15,y:3.35});
      }
    }
  }

  // end gate + brazier
  const gateMat=new THREE.MeshStandardMaterial({color:0x161010,roughness:.7,metalness:.5});
  const gate=new THREE.Mesh(new THREE.BoxGeometry(HW*2-0.4,H-0.3,0.6),gateMat);
  gate.position.set(0,(H-0.3)/2,ZEND-0.2); gate.castShadow=true; gate.receiveShadow=true; g.add(gate);
  // glowing seams on the gate
  const seamMat=new THREE.MeshBasicMaterial({color:0xff3a08,transparent:true,blending:THREE.AdditiveBlending});
  for(let k=-2;k<=2;k++){const seam=new THREE.Mesh(new THREE.PlaneGeometry(0.06,H-0.6),seamMat);seam.position.set(k*1.6,(H-0.3)/2,ZEND+0.12);g.add(seam);}
  const gateGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:0xff3a10,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  gateGlow.scale.set(14,10,1);gateGlow.position.set(0,3,ZEND+0.4);g.add(gateGlow);
  const gateLight=new THREE.PointLight(0xff3a10,2.4,20,2);gateLight.position.set(0,3,ZEND+2);g.add(gateLight);
  // brazier lava pool before gate
  const pool=new THREE.Mesh(new THREE.CircleGeometry(2.4,32),lavaMat);pool.rotation.x=-Math.PI/2;pool.position.set(0,0.03,ZEND+4);g.add(pool);
  const poolLight=new THREE.PointLight(0xff5a1a,2.2,16,2);poolLight.position.set(0,1.2,ZEND+4);g.add(poolLight);

  // ================================================================
  // WINGS — a generic straight segment builder (flat halls AND stairs)
  // heading indices: 0 = -Z (into hall A), 1 = +X, 2 = +Z, 3 = -X
  // ================================================================
  const YAW=[Math.PI, Math.PI/2, 0, -Math.PI/2];
  const chainGroups=[];
  const steamSystems=[];
  const dripSystems=[];

  function buildSegment(origin,heading,run,rise,halfWidth,height,matFn,tints,opts){
    opts=opts||{};
    const pitch = rise ? -Math.atan2(rise,run) : 0;
    const Lslant = Math.hypot(run,rise);
    const group=new THREE.Group();
    group.position.set(origin.x,origin.y,origin.z);
    group.rotation.order='YXZ';
    group.rotation.set(pitch,YAW[heading],0);
    scene.add(group);

    const rep=[Math.max(1,Lslant/6),2];
    const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant), matFn(rep,tints.floor));
    floorMesh.rotation.x=-Math.PI/2; floorMesh.position.set(0,0,Lslant/2); floorMesh.receiveShadow=true; group.add(floorMesh);
    const ceilMesh=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant), matFn(rep,tints.ceil));
    ceilMesh.rotation.x=Math.PI/2; ceilMesh.position.set(0,height,Lslant/2); ceilMesh.receiveShadow=true; group.add(ceilMesh);
    for(const sgn of [-1,1]){
      const wallMesh=new THREE.Mesh(new THREE.PlaneGeometry(Lslant,height), matFn(rep,tints.wall));
      wallMesh.rotation.y=sgn*Math.PI/2; wallMesh.position.set(sgn*halfWidth,height/2,Lslant/2);
      wallMesh.receiveShadow=true; wallMesh.castShadow=true; group.add(wallMesh);
    }
    if(opts.stripes){
      const stripe=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant),
        new THREE.MeshBasicMaterial({map:stairStripeTex(opts.stripes),transparent:true,opacity:.55,depthWrite:false}));
      stripe.rotation.x=-Math.PI/2; stripe.position.set(0,0.015,Lslant/2); group.add(stripe);
    }
    return group;
  }

  function addChain(parent, lx, lz, ceilingY, len){
    const grp=new THREE.Group(); grp.position.set(lx,ceilingY,lz); parent.add(grp);
    const linkMat=new THREE.MeshStandardMaterial({color:0x1c1a18,roughness:.6,metalness:.7});
    const n=Math.max(4,Math.round(len/0.17));
    for(let i=0;i<n;i++){
      const link=new THREE.Mesh(new THREE.TorusGeometry(0.085,0.026,6,8),linkMat);
      link.position.y=-i*0.17;
      link.rotation.x=(i%2===0)?0:Math.PI/2;
      link.castShadow=true;
      grp.add(link);
    }
    chainGroups.push(grp);
    return grp;
  }

  function addBloodDecal(parent, lx,ly,lz, ry, w,h){
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({map:bloodTex(),transparent:true,depthWrite:false}));
    mesh.position.set(lx,ly,lz); mesh.rotation.y=ry;
    parent.add(mesh);
    return mesh;
  }

  function addPipeRun(parent, lengthZ, lx, ly, radius){
    const mat=new THREE.MeshStandardMaterial({color:0x3a3128,roughness:.5,metalness:.55});
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,lengthZ,10), mat);
    pipe.rotation.x=Math.PI/2; pipe.position.set(lx,ly,lengthZ/2);
    pipe.castShadow=true; pipe.receiveShadow=true;
    parent.add(pipe);
    const nB=Math.max(2,Math.round(lengthZ/4));
    const brMat=new THREE.MeshStandardMaterial({color:0x0e0c0a,roughness:.8,metalness:.3});
    for(let i=0;i<=nB;i++){
      const bz=i*(lengthZ/nB);
      const br=new THREE.Mesh(new THREE.BoxGeometry(radius*2.6,0.12,0.12), brMat);
      br.position.set(lx,ly,bz);
      parent.add(br);
    }
    return pipe;
  }

  function addSteamPuffs(parent, count, spanZ, halfWidth, ceilY){
    const pos=new Float32Array(count*3);
    for(let i=0;i<count;i++){ pos[i*3]=(Math.random()-.5)*halfWidth*1.4; pos[i*3+1]=Math.random()*ceilY*0.7; pos[i*3+2]=Math.random()*spanZ; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({size:0.6,map:steamT,color:0xcfcfcf,transparent:true,opacity:.32,depthWrite:false});
    const pts=new THREE.Points(geo,mat); parent.add(pts);
    steamSystems.push({geo,count,spanZ,halfWidth,ceilY});
  }

  function addBloodDrips(parent, count, spanZ, halfWidth, ceilY){
    const pos=new Float32Array(count*3), vel=new Float32Array(count);
    for(let i=0;i<count;i++){ pos[i*3]=(Math.random()-.5)*halfWidth*1.6; pos[i*3+1]=ceilY*(0.5+Math.random()*0.5); pos[i*3+2]=Math.random()*spanZ; vel[i]=0.6+Math.random()*1.0; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({size:0.05,map:dropTex,color:0xa00810,transparent:true,opacity:.9,depthWrite:false});
    const pts=new THREE.Points(geo,mat); parent.add(pts);
    dripSystems.push({geo,count,vel,ceilY,spanZ,halfWidth});
  }

  // ---- wing constants ----
  const CAVE_HW=4.0, CAVE_H=5.4, CAVE_LEN=26;
  const BOIL_HW=4.2, BOIL_H=5.6, BOIL_LEN=26;
  const STAIR_LEN=12, STAIR_RISE=3.4;
  const HALLC_LEN=24, HALLE_LEN=24;

  const caveTurnX = -HW-CAVE_LEN;
  const boilTurnX =  HW+BOIL_LEN;
  const caveStairEndZ = JZ-STAIR_LEN;
  const caveHallEndZ  = caveStairEndZ-HALLC_LEN;
  const boilStairEndZ = JZ-STAIR_LEN;
  const boilHallEndZ  = boilStairEndZ-HALLE_LEN;

  // --- LEFT WING: cave, chains ---
  const caveCorridorGrp = buildSegment({x:-HW,y:0,z:JZ}, 3, CAVE_LEN, 0, CAVE_HW, CAVE_H, caveMat,
    {floor:0x3c3630,ceil:0x121614,wall:0x2a2c26});
  for(let i=1;i<=5;i++) addChain(caveCorridorGrp, (i%2?-1:1)*(CAVE_HW-1.1), i*(CAVE_LEN/6), CAVE_H, 1.3+Math.random()*0.6);

  const caveStairGrp = buildSegment({x:caveTurnX,y:0,z:JZ}, 0, STAIR_LEN, STAIR_RISE, CAVE_HW, CAVE_H, caveMat,
    {floor:0x322e28,ceil:0x121614,wall:0x282a24}, {stripes:16});
  addChain(caveStairGrp, -(CAVE_HW-1.1), STAIR_LEN*0.3, CAVE_H, 1.1);
  addChain(caveStairGrp, (CAVE_HW-1.1), STAIR_LEN*0.7, CAVE_H, 1.1);

  const caveHallGrp = buildSegment({x:caveTurnX,y:STAIR_RISE,z:caveStairEndZ}, 0, HALLC_LEN, 0, CAVE_HW, CAVE_H, caveMat,
    {floor:0x3c3630,ceil:0x121614,wall:0x2a2c26});
  for(let i=1;i<=4;i++) addChain(caveHallGrp, (i%2?-1:1)*(CAVE_HW-1.1), i*(HALLC_LEN/5), CAVE_H, 1.2+Math.random()*0.8);
  // dim cool glow accents down the cave wing (steady, not fire-flicker)
  for(const grp of [caveCorridorGrp,caveHallGrp]){
    for(let i=1;i<=2;i++){
      const gl=new THREE.PointLight(0x2a6a5a,0.55,9,2);
      gl.position.set((i%2?-1:1)*1.2, CAVE_H-0.6, (grp===caveCorridorGrp?CAVE_LEN:HALLC_LEN)*(i/3));
      grp.add(gl);
    }
  }

  // --- RIGHT WING: boiler room, pipes, blood ---
  const boilCorridorGrp = buildSegment({x:HW,y:0,z:JZ}, 1, BOIL_LEN, 0, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x362e26,ceil:0x18120e,wall:0x2e2620});
  addPipeRun(boilCorridorGrp, BOIL_LEN, -(BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addPipeRun(boilCorridorGrp, BOIL_LEN,  (BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addBloodDecal(boilCorridorGrp, -(BOIL_HW-0.02), BOIL_H*0.62, BOIL_LEN*0.28, Math.PI/2, 2.6,3.4);
  addBloodDecal(boilCorridorGrp,  (BOIL_HW-0.02), BOIL_H*0.58, BOIL_LEN*0.62, -Math.PI/2, 2.2,3.0);
  addBloodDecal(boilCorridorGrp, 0, BOIL_H-0.02, BOIL_LEN*0.45, Math.PI/2, 2.0,2.0);
  addSteamPuffs(boilCorridorGrp, 40, BOIL_LEN, BOIL_HW, BOIL_H);
  addBloodDrips(boilCorridorGrp, 50, BOIL_LEN, BOIL_HW, BOIL_H);

  const boilStairGrp = buildSegment({x:boilTurnX,y:0,z:JZ}, 0, STAIR_LEN, -STAIR_RISE, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x2c2620,ceil:0x18120e,wall:0x261f1a}, {stripes:16});
  addBloodDecal(boilStairGrp, -(BOIL_HW-0.02), BOIL_H*0.5, STAIR_LEN*0.5, Math.PI/2, 2.0,2.6);

  const boilHallGrp = buildSegment({x:boilTurnX,y:-STAIR_RISE,z:boilStairEndZ}, 0, HALLE_LEN, 0, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x362e26,ceil:0x18120e,wall:0x2e2620});
  addPipeRun(boilHallGrp, HALLE_LEN, -(BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addPipeRun(boilHallGrp, HALLE_LEN,  (BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addBloodDecal(boilHallGrp, -(BOIL_HW-0.02), BOIL_H*0.55, HALLE_LEN*0.3, Math.PI/2, 2.4,3.2);
  addBloodDecal(boilHallGrp,  (BOIL_HW-0.02), BOIL_H*0.6, HALLE_LEN*0.7, -Math.PI/2, 2.6,3.4);
  addSteamPuffs(boilHallGrp, 34, HALLE_LEN, BOIL_HW, BOIL_H);
  addBloodDrips(boilHallGrp, 40, HALLE_LEN, BOIL_HW, BOIL_H);

  // industrial caged-bulb lights along the boiler wing (reuse the torch flicker loop)
  for(const grp of [boilCorridorGrp,boilHallGrp]){
    const len = grp===boilCorridorGrp?BOIL_LEN:HALLE_LEN;
    for(let i=1;i<=3;i++){
      const cage=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), new THREE.MeshStandardMaterial({color:0xffe9b0,emissive:0xffb050,emissiveIntensity:1.6,roughness:.4}));
      cage.position.set((i%2?-1:1)*(BOIL_HW-0.7), BOIL_H-0.4, len*(i/4));
      grp.add(cage);
      const bl=new THREE.PointLight(0xffb060,1.4,10,2);
      bl.position.copy(cage.position);
      grp.add(bl);
      torchLights.push({pl:bl,base:1.4});
    }
  }

  // ---------------- lights ----------------
  scene.add(new THREE.AmbientLight(0x241009,0.5));
  scene.add(new THREE.HemisphereLight(0x1a0a04,0x000000,0.35));
  // player's torch: warm point fill + a shadow-casting spotlight thrown ahead
  const torchFill=new THREE.PointLight(0xff8636,1.8,12,2); scene.add(torchFill);
  const throwLight=new THREE.SpotLight(0xffb060,3.0,32,0.72,0.5,1.4);
  throwLight.castShadow=true; throwLight.shadow.mapSize.set(1024,1024);
  throwLight.shadow.camera.near=0.5; throwLight.shadow.camera.far=34; throwLight.shadow.bias=-0.0006;
  scene.add(throwLight); scene.add(throwLight.target);
  // (held flame removed — the carried warmth is the point light below)

  // ---------------- embers ----------------
  const EN=260;
  const ep=new Float32Array(EN*3), ev=new Float32Array(EN);
  for(let i=0;i<EN;i++){ep[i*3]=(Math.random()-.5)*HW*2;ep[i*3+1]=Math.random()*H;ep[i*3+2]=2.5-Math.random()*LEN;ev[i]=0.3+Math.random()*0.8;}
  const egeo=new THREE.BufferGeometry();egeo.setAttribute('position',new THREE.BufferAttribute(ep,3));
  const emat=new THREE.PointsMaterial({size:0.09,map:emberTex,color:0xffa040,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.9});
  const embers=new THREE.Points(egeo,emat);scene.add(embers);

  // dust motes in torch light
  const dust=new THREE.Points(egeo.clone(),new THREE.PointsMaterial({size:0.03,color:0x886644,transparent:true,opacity:.25,depthWrite:false}));
  scene.add(dust);

  // ---------------- input ----------------
  const keys={};
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
  let locked=false;
  document.addEventListener('pointerlockchange',()=>{locked=(document.pointerLockElement===canvas);});
  addEventListener('mousemove',e=>{ if(!locked||mode!=='play')return;
    player.yaw-=e.movementX*0.0022; player.pitch-=e.movementY*0.0022;
    player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch)); });

  let mode='intro';
  const introEl=document.getElementById('intro'), endEl=document.getElementById('endscreen');
  const objEl=document.getElementById('obj'), hudEl=document.getElementById('hud');
  const hintShown={};
  function start(){
    if(mode==='play')return;
    introEl.classList.add('hidden'); endEl.classList.add('hidden');
    mode='play'; objEl.textContent='Reach the Gate at the end of the hall';
    hudEl.textContent='the fire keeps the dark at bay'; hudEl.style.opacity=1;
    setTimeout(()=>{hudEl.style.opacity=0;},6000);
    try{canvas.requestPointerLock();}catch(e){}
    Audio.start();
  }
  document.getElementById('enterBtn').addEventListener('click',start);
  document.getElementById('againBtn').addEventListener('click',()=>{
    player.x=0;player.z=2.5;player.yaw=0;player.pitch=0;player.elev=0;
    for(const k in hintShown) delete hintShown[k];
    start();
  });
  canvas.addEventListener('click',()=>{ if(mode==='play'&&!locked){try{canvas.requestPointerLock();}catch(e){}} });

  function endGame(title,sub){ mode='end'; document.exitPointerLock&&document.exitPointerLock();
    document.getElementById('endtitle').textContent=title; document.getElementById('endsub').textContent=sub;
    endEl.classList.remove('hidden'); }

  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  function showHint(key,text){ if(hintShown[key])return; hintShown[key]=true; objEl.style.opacity=0;
    setTimeout(()=>{objEl.textContent=text; objEl.style.opacity=1;},350); }

  // ---------------- movement / collision across the branching wings ----------------
  function inRect(x,z,x0,x1,z0,z1){ return x>=Math.min(x0,x1)&&x<=Math.max(x0,x1)&&z>=Math.min(z0,z1)&&z<=Math.max(z0,z1); }
  const M=0.7; // wall clearance margin for wing corridors
  function resolvePosition(nx,nz){
    // cave stairs (up)
    if(inRect(nx,nz, caveTurnX-CAVE_HW, caveTurnX+CAVE_HW, caveStairEndZ, JZ)){
      const cx=Math.max(caveTurnX-CAVE_HW+M,Math.min(caveTurnX+CAVE_HW-M,nx));
      const cz=Math.max(caveStairEndZ,Math.min(JZ,nz));
      const frac=(JZ-cz)/STAIR_LEN;
      showHint('caveStairs','THE PASSAGE CLIMBS');
      return {x:cx,z:cz,y:frac*STAIR_RISE,zone:'cave'};
    }
    // cave hallway C (far)
    if(inRect(nx,nz, caveTurnX-CAVE_HW, caveTurnX+CAVE_HW, caveHallEndZ, caveStairEndZ)){
      const cx=Math.max(caveTurnX-CAVE_HW+M,Math.min(caveTurnX+CAVE_HW-M,nx));
      const cz=Math.max(caveHallEndZ+M,Math.min(caveStairEndZ,nz));
      return {x:cx,z:cz,y:STAIR_RISE,zone:'cave'};
    }
    // cave corridor B
    if(inRect(nx,nz, caveTurnX, -HW, JZ-CAVE_HW, JZ+CAVE_HW)){
      const cx=Math.max(caveTurnX+M,Math.min(-HW,nx));
      const cz=Math.max(JZ-CAVE_HW+M,Math.min(JZ+CAVE_HW-M,nz));
      showHint('cave','A DAMP PASSAGE, CHAINS OVERHEAD');
      return {x:cx,z:cz,y:0,zone:'cave'};
    }
    // boiler stairs (down)
    if(inRect(nx,nz, boilTurnX-BOIL_HW, boilTurnX+BOIL_HW, boilStairEndZ, JZ)){
      const cx=Math.max(boilTurnX-BOIL_HW+M,Math.min(boilTurnX+BOIL_HW-M,nx));
      const cz=Math.max(boilStairEndZ,Math.min(JZ,nz));
      const frac=(JZ-cz)/STAIR_LEN;
      showHint('boilStairs','THE PASSAGE DESCENDS');
      return {x:cx,z:cz,y:-frac*STAIR_RISE,zone:'boiler'};
    }
    // boiler hallway E (far)
    if(inRect(nx,nz, boilTurnX-BOIL_HW, boilTurnX+BOIL_HW, boilHallEndZ, boilStairEndZ)){
      const cx=Math.max(boilTurnX-BOIL_HW+M,Math.min(boilTurnX+BOIL_HW-M,nx));
      const cz=Math.max(boilHallEndZ+M,Math.min(boilStairEndZ,nz));
      return {x:cx,z:cz,y:-STAIR_RISE,zone:'boiler'};
    }
    // boiler corridor D
    if(inRect(nx,nz, HW, boilTurnX, JZ-BOIL_HW, JZ+BOIL_HW)){
      const cx=Math.max(HW,Math.min(boilTurnX-M,nx));
      const cz=Math.max(JZ-BOIL_HW+M,Math.min(JZ+BOIL_HW-M,nz));
      showHint('boiler','METAL GROANS AROUND YOU');
      return {x:cx,z:cz,y:0,zone:'boiler'};
    }
    // default: main hall A
    const cx=Math.max(-HW+0.9,Math.min(HW-0.9,nx));
    const cz=Math.max(ZEND+2.4,Math.min(3.2,nz));
    if(cz<JZ+GAPH+2 && cz>JZ-GAPH-2 && !hintShown.junction){ showHint('junction','THE HALL SPLITS — LEFT OR RIGHT'); }
    return {x:cx,z:cz,y:0,zone:'hall'};
  }

  // ---------------- audio (procedural, guarded) ----------------
  const Audio=(function(){
    let ctx,master,started=false,drone,crackTimer=0,dripTimer=0,hissTimer=0,groanTimer=0;
    function start(){ if(started)return; try{
      ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);
      // low drone
      const o1=ctx.createOscillator(),o2=ctx.createOscillator(),dg=ctx.createGain();
      o1.type='sine';o1.frequency.value=44;o2.type='sine';o2.frequency.value=55.3;dg.gain.value=0.12;
      o1.connect(dg);o2.connect(dg);dg.connect(master);o1.start();o2.start();drone=dg;
      // wind noise
      const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const dd=buf.getChannelData(0);
      for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
      const ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;const nf=ctx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=280;
      const ng=ctx.createGain();ng.gain.value=0.06;ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start();
      started=true;
    }catch(e){} }
    function crackle(){ if(!started)return; try{const t=ctx.currentTime;const o=ctx.createOscillator(),gn=ctx.createGain();
      o.type='square';o.frequency.value=600+Math.random()*1400;gn.gain.setValueAtTime(0.0,t);gn.gain.linearRampToValueAtTime(0.05,t+0.005);
      gn.gain.exponentialRampToValueAtTime(0.001,t+0.06);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.07);}catch(e){} }
    function roar(){ if(!started)return; try{const t=ctx.currentTime;const o=ctx.createOscillator(),gn=ctx.createGain(),f=ctx.createBiquadFilter();
      f.type='lowpass';f.frequency.value=200;o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(38,t+1.6);
      gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(0.16,t+0.4);gn.gain.exponentialRampToValueAtTime(0.001,t+2.0);
      o.connect(f);f.connect(gn);gn.connect(master);o.start(t);o.stop(t+2.1);}catch(e){} }
    function dripSound(){ if(!started)return; try{const t=ctx.currentTime;const o=ctx.createOscillator(),gn=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(900+Math.random()*500,t);o.frequency.exponentialRampToValueAtTime(220,t+0.09);
      gn.gain.setValueAtTime(0.0,t);gn.gain.linearRampToValueAtTime(0.09,t+0.006);gn.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.15);}catch(e){} }
    function hiss(){ if(!started)return; try{const t=ctx.currentTime;
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.4,ctx.sampleRate);const dd=buf.getChannelData(0);
      for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
      const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1800;
      const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(0.05,t+0.05);gn.gain.exponentialRampToValueAtTime(0.001,t+0.6);
      src.connect(f);f.connect(gn);gn.connect(master);src.start(t);src.stop(t+0.65);}catch(e){} }
    function groan(){ if(!started)return; try{const t=ctx.currentTime;const o=ctx.createOscillator(),gn=ctx.createGain(),f=ctx.createBiquadFilter();
      f.type='lowpass';f.frequency.value=320;o.type='sawtooth';o.frequency.setValueAtTime(60+Math.random()*20,t);o.frequency.linearRampToValueAtTime(46,t+1.4);
      gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(0.07,t+0.3);gn.gain.exponentialRampToValueAtTime(0.001,t+1.8);
      o.connect(f);f.connect(gn);gn.connect(master);o.start(t);o.stop(t+1.9);}catch(e){} }
    function tick(dt,zone){ if(!started)return; crackTimer-=dt; if(crackTimer<=0){crackle();crackTimer=0.05+Math.random()*0.14;}
      if(Math.random()<dt*0.06) roar();
      if(zone==='cave'){ dripTimer-=dt; if(dripTimer<=0){dripSound();dripTimer=0.6+Math.random()*1.6;} }
      if(zone==='boiler'){
        hissTimer-=dt; if(hissTimer<=0){hiss();hissTimer=1.5+Math.random()*3.0;}
        groanTimer-=dt; if(groanTimer<=0){groan();groanTimer=3.5+Math.random()*5.0;}
      }
    }
    return {start,tick};
  })();

  // ---------------- loop ----------------
  const fwd=new THREE.Vector3(), fq=new THREE.Vector3();
  const clock=new THREE.Clock(); let bob=0, gtex=0;
  const grain=document.getElementById('grain'),gctx=grain.getContext('2d');
  function sizeGrain(){grain.width=Math.floor(innerWidth/3);grain.height=Math.floor(innerHeight/3);}
  sizeGrain();addEventListener('resize',sizeGrain);
  let gframe=0;
  function drawGrain(){const w=grain.width,h=grain.height,img=gctx.createImageData(w,h),d=img.data;
    for(let i=0;i<w*h;i++){const v=Math.random()*255;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}gctx.putImageData(img,0,0);}

  let curZone='hall';
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;

    if(mode==='play'){
      const run=(keys['shift'])?1.8:1.0;
      const sp=3.2*run*dt;
      let mx=0,mz=0;
      if(keys['w']||keys['arrowup'])mz+=1; if(keys['s']||keys['arrowdown'])mz-=1;
      if(keys['a']||keys['arrowleft'])mx-=1; if(keys['d']||keys['arrowright'])mx+=1;
      const len=Math.hypot(mx,mz)||1; mx/=len;mz/=len;
      const sinY=Math.sin(player.yaw),cosY=Math.cos(player.yaw);
      const nx = player.x + (mx*cosY - mz*sinY)*sp;
      const nz = player.z + (-mx*sinY - mz*cosY)*sp;
      const res=resolvePosition(nx,nz);
      player.x=res.x; player.z=res.z; player.elev=res.y; curZone=res.zone;
      // reached gate? (only true when actually in the main hall near its far wall)
      if(curZone==='hall' && player.z<ZEND+2.7){ endGame('THE GATE','it will not open… not yet'); }
      // head bob
      const moving=(mx||mz);
      if(moving) bob+=dt*10*run;
      camera.position.set(player.x,player.elev+EYE+Math.sin(bob)*0.06,player.z);
      camera.rotation.set(player.pitch,player.yaw,0);
      Audio.tick(dt,curZone);
    } else {
      camera.position.set(player.x,player.elev+EYE,player.z);
      camera.rotation.set(player.pitch,player.yaw,0);
    }

    // fog thickens on the way down into the boiler depths
    const targetFog = (curZone==='boiler' && player.elev<-0.6) ? FOG_DEEP : FOG_BASE;
    scene.fog.density += (targetFog-scene.fog.density)*Math.min(1,dt*0.6);

    // torch throw + fill follow camera
    camera.getWorldDirection(fwd);
    throwLight.position.copy(camera.position);
    throwLight.target.position.copy(camera.position).addScaledVector(fwd,9); throwLight.target.position.y-=1.5;
    throwLight.target.updateMatrixWorld();
    const flick=0.78+Math.sin(t*23)*0.06+Math.random()*0.16;
    throwLight.intensity=3.0*flick; torchFill.intensity=1.8*flick;
    torchFill.position.copy(camera.position).addScaledVector(fwd,0.6); torchFill.position.y-=0.2;

    // wall torches / caged bulbs flicker
    for(const T of torchLights){T.pl.intensity=T.base*(0.72+Math.sin(t*17+T.pl.position.z)*0.12+Math.random()*0.18);}
    for(const F of flames){F.fl.scale.set(0.8+Math.random()*0.2,1.15+Math.random()*0.3,1);F.fl.position.y=F.y+Math.random()*0.05;}
    // lava pulse
    lavaMat.emissiveIntensity=2.1+Math.sin(t*2.3)*0.4;
    gtex+=dt*0.03; lavaMat.emissiveMap.offset.y=gtex; lavaMat.map.offset.y=gtex;
    gateLight.intensity=2.0+Math.sin(t*3.1)*0.6; poolLight.intensity=2.0+Math.sin(t*2.0+1)*0.5;
    seamMat.opacity=0.6+Math.sin(t*4)*0.3;

    // hanging chains sway gently
    for(const c of chainGroups){ c.rotation.z=Math.sin(t*0.7+c.position.x*3+c.position.z)*0.035; c.rotation.x=Math.sin(t*0.55+c.position.z*2)*0.02; }

    // steam puffs rise and fade back to the floor
    for(const S of steamSystems){
      const arr=S.geo.attributes.position.array;
      for(let i=0;i<S.count;i++){ arr[i*3+1]+=dt*0.4; arr[i*3]+=Math.sin(t*1.2+i)*dt*0.06;
        if(arr[i*3+1]>S.ceilY*0.85){ arr[i*3+1]=0.1; arr[i*3]=(Math.random()-.5)*S.halfWidth*1.4; arr[i*3+2]=Math.random()*S.spanZ; } }
      S.geo.attributes.position.needsUpdate=true;
    }
    // blood drips fall and reset near the ceiling
    for(const D of dripSystems){
      const arr=D.geo.attributes.position.array;
      for(let i=0;i<D.count;i++){ arr[i*3+1]-=D.vel[i]*dt;
        if(arr[i*3+1]<0.05){ arr[i*3+1]=D.ceilY*(0.5+Math.random()*0.5); arr[i*3]=(Math.random()-.5)*D.halfWidth*1.6; arr[i*3+2]=Math.random()*D.spanZ; } }
      D.geo.attributes.position.needsUpdate=true;
    }

    // embers rise
    const ea=egeo.attributes.position.array;
    for(let i=0;i<EN;i++){ea[i*3+1]+=ev[i]*dt; ea[i*3]+=Math.sin(t*1.5+i)*dt*0.15; if(ea[i*3+1]>H){ea[i*3+1]=0;ea[i*3]=(Math.random()-.5)*HW*2;ea[i*3+2]=2.5-Math.random()*LEN;}}
    egeo.attributes.position.needsUpdate=true;

    if((gframe++&1)===0) drawGrain();
    renderer.render(scene,camera);
  }

  // reveal after first render
  requestAnimationFrame(()=>{ animate(); setTimeout(()=>{loadwrap.style.opacity=0;setTimeout(()=>loadwrap.style.display='none',600);},250); });
  window.__HELL={start:()=>start(), dbg:()=>{try{renderer.shadowMap.enabled=false;throwLight.castShadow=false;renderer.setPixelRatio(1);scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});}catch(e){}}};
})();
</script>
<script>
/* Background music hook — drop a royalty-free track named music.mp3 into the repo and it plays
   (looping) the moment the player descends. Mute toggle top-right. Missing file fails silently. */
(function(){
  var bgm=document.getElementById('bgm'), mute=document.getElementById('mute');
  if(!bgm||!mute)return;
  var muted=true, wanted=false;           // start muted until user descends / toggles
  bgm.volume=0.55;
  function play(){ if(muted)return; var p=bgm.play(); if(p&&p.catch)p.catch(function(){}); }
  function descend(){ wanted=true; if(muted){muted=false; mute.classList.remove('off');} play(); }
  var a=document.getElementById('enterBtn'), b=document.getElementById('againBtn');
  if(a)a.addEventListener('click',descend);
  if(b)b.addEventListener('click',descend);
  mute.addEventListener('click',function(){
    muted=!muted; mute.classList.toggle('off',muted);
    if(muted){bgm.pause();} else {wanted=true; play();}
  });
})();
</script>
