<style>
  *{margin:0;padding:0;box-sizing:border-box}

  .pauseBtn.primary{background:linear-gradient(180deg,#ff8a3a,#c43a10);color:#0a0402;border:none}

  #touchStick{position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,150,90,.5);

  #touchStick .knob{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,150,90,.55);

  #touchJump{position:absolute;right:26px;bottom:130px;width:68px;height:68px;border-radius:50%;
    background:rgba(255,120,50,.22);border:2px solid rgba(255,150,90,.55);color:#ffd9b0;font-family:'Cinzel';
    font-size:11px;letter-spacing:.06em;pointer-events:auto;touch-action:none}
  #touchPause{position:fixed;top:16px;right:58px;z-index:8;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,120,50,.4);background:rgba(20,6,3,.5);color:#ffb070;font-size:15px;
    pointer-events:auto;touch-action:none;display:none}
  #touchPause.active{display:flex;align-items:center;justify-content:center}
</style>

<script src="./three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
<script>
(function(){
  const hasWebGL=(function(){try{const c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;}})();
  const loadwrap=document.getElementById('loadwrap');
  if(!hasWebGL||typeof THREE==='undefined'){ loadwrap.querySelector('.t').textContent='WebGL not available in this browser.'; return; }

  // ---------------- renderer / scene ----------------
  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  const scene=new THREE.Scene();
  const FOG=0x0b0402;
  const FOG_BASE=0.055, FOG_DEEP=0.1;
  scene.fog=new THREE.FogExp2(FOG,FOG_BASE);
  scene.background=new THREE.Color(FOG);

  const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,0.05,140);
  camera.rotation.order='YXZ';
  const EYE=1.62;
  const player={x:0,z:2.5,yaw:0,pitch:0,elev:0,vy:0,airY:0,grounded:true};   // start looking down -z (into the hall)
  camera.position.set(player.x,EYE,player.z);

  // ---------------- procedural textures ----------------
  function noiseCanvas(size,base,contrast){
    const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    const img=x.createImageData(size,size),d=img.data;
    // value noise via random + smoothing octaves
    function grid(step){const g=[];for(let i=0;i<(size/step+2)*(size/step+2);i++)g.push(Math.random());return g;}
    const layers=[[32,.5],[12,.32],[4,.18]].map(([st,w])=>({st,w,g:grid(st)}));
    for(let y=0;y<size;y++)for(let x2=0;x2<size;x2++){
      let n=0,wsum=0;
      for(const L of layers){const gx=x2/L.st,gy=y/L.st,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy,w=Math.floor(size/L.st)+2;
        const a=L.g[iy*w+ix],b=L.g[iy*w+ix+1],c2=L.g[(iy+1)*w+ix],dd=L.g[(iy+1)*w+ix+1];
        const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
        const val=(a*(1-sx)+b*sx)*(1-sy)+(c2*(1-sx)+dd*sx)*sy;
        n+=val*L.w;wsum+=L.w;}
      n/=wsum; n=(n-0.5)*contrast+0.5; n=Math.max(0,Math.min(1,n));
      const p=(y*size+x2)*4; d[p]=d[p+1]=d[p+2]=n*255; d[p+3]=255;
    }
    x.putImageData(img,0,0);
    return c;
  }
  // stone: diffuse (with mortar joints + cracks) + normal derived from luminance
  function stoneMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.5,1.6); const hx=hc.getContext('2d');
    // brick mortar joints (darker grooves)
    hx.strokeStyle='rgba(0,0,0,.55)';hx.lineWidth=3;
    for(let y=32;y<size;y+=42){hx.beginPath();hx.moveTo(0,y);hx.lineTo(size,y);hx.stroke();}
    for(let y=32,row=0;y<size;y+=42,row++){const off=row%2?21:0;for(let xx=off;xx<size;xx+=52){hx.beginPath();hx.moveTo(xx,y);hx.lineTo(xx,y+42);hx.stroke();}}
    // cracks
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=1.4;
    for(let i=0;i<26;i++){let px=Math.random()*size,py=Math.random()*size;hx.beginPath();hx.moveTo(px,py);
      for(let k=0;k<5;k++){px+=(Math.random()-.5)*40;py+=(Math.random()-.5)*40;hx.lineTo(px,py);}hx.stroke();}
    // diffuse: tint the height toward cold dark stone with warm grime
    const dc=document.createElement('canvas');dc.width=dc.height=size;const dx=dc.getContext('2d');
    const src=hx.getImageData(0,0,size,size).data;const dimg=dx.createImageData(size,size),dd=dimg.data;
    for(let i=0;i<size*size;i++){const h=src[i*4]/255;
      const r=18+h*70+ (Math.random()<.02?40:0), g=15+h*54, b=14+h*46;
      dd[i*4]=r;dd[i*4+1]=g;dd[i*4+2]=b;dd[i*4+3]=255;}
    dx.putImageData(dimg,0,0);
    // normal map from height luminance gradient
    const nc=document.createElement('canvas');nc.width=nc.height=size;const nx=nc.getContext('2d');
    const nimg=nx.createImageData(size,size),nd=nimg.data;const S=2.2;
    const H=(x,y)=>src[((((y+size)%size)*size)+((x+size)%size))*4]/255;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const dxv=(H(x-1,y)-H(x+1,y))*S, dyv=(H(x,y-1)-H(x,y+1))*S;
      let nxv=dxv,nyv=dyv,nzv=1; const len=Math.hypot(nxv,nyv,nzv);nxv/=len;nyv/=len;nzv/=len;
      const p=(y*size+x)*4; nd[p]=(nxv*.5+.5)*255; nd[p+1]=(nyv*.5+.5)*255; nd[p+2]=(nzv*.5+.5)*255; nd[p+3]=255;}
    nx.putImageData(nimg,0,0);
    const map=new THREE.CanvasTexture(dc), nrm=new THREE.CanvasTexture(nc);
    [map,nrm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
    return {map,nrm};
  }
  // cave rock: organic cracks + damp blotches, cooler palette, no brick grid
  function caveMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.46,2.0); const hx=hc.getContext('2d');
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=1.6;
    for(let i=0;i<34;i++){let px=Math.random()*size,py=Math.random()*size;hx.beginPath();hx.moveTo(px,py);
      for(let k=0;k<6;k++){px+=(Math.random()-.5)*44;py+=(Math.random()-.5)*44;hx.lineTo(px,py);}hx.stroke();}
    for(let i=0;i<10;i++){const px=Math.random()*size,py=Math.random()*size,r=10+Math.random()*30;
      const gr=hx.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
      hx.fillStyle=gr;hx.beginPath();hx.arc(px,py,r,0,7);hx.fill();}
    const dc=document.createElement('canvas');dc.width=dc.height=size;const dx=dc.getContext('2d');
    const src=hx.getImageData(0,0,size,size).data;const dimg=dx.createImageData(size,size),dd=dimg.data;
    for(let i=0;i<size*size;i++){const h=src[i*4]/255;
      const r=12+h*46, gg=16+h*56+(Math.random()<.015?26:0), b=15+h*50;
      dd[i*4]=r;dd[i*4+1]=gg;dd[i*4+2]=b;dd[i*4+3]=255;}
    dx.putImageData(dimg,0,0);
    const nc=document.createElement('canvas');nc.width=nc.height=size;const nx=nc.getContext('2d');
    const nimg=nx.createImageData(size,size),nd=nimg.data;const S=2.6;
    const H2=(x,y)=>src[((((y+size)%size)*size)+((x+size)%size))*4]/255;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      const dxv=(H2(x-1,y)-H2(x+1,y))*S, dyv=(H2(x,y-1)-H2(x,y+1))*S;
      let nxv=dxv,nyv=dyv,nzv=1; const len=Math.hypot(nxv,nyv,nzv);nxv/=len;nyv/=len;nzv/=len;
      const p=(y*size+x)*4; nd[p]=(nxv*.5+.5)*255; nd[p+1]=(nyv*.5+.5)*255; nd[p+2]=(nzv*.5+.5)*255; nd[p+3]=255;}
    nx.putImageData(nimg,0,0);
    const map=new THREE.CanvasTexture(dc), nrm=new THREE.CanvasTexture(nc);
    [map,nrm].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
    return {map,nrm};
  }
  // boiler metal: riveted panel seams + rust blotches
  function boilerMaps(){
    const size=256;
    const hc=noiseCanvas(size,0.5,1.3); const hx=hc.getContext('2d');
    hx.strokeStyle='rgba(0,0,0,.6)';hx.lineWidth=3;
    for(let y=0;y<size;y+=64){hx.beginPath();hx.moveTo(0,y);hx.lineTo(size,y);hx.stroke();}
    for(let x=0;x<size;x+=64){hx.beginPath();hx.moveTo(x,0);hx.lineTo(x,size);hx.stroke();}
    hx.fillStyle='rgba(0,0,0,.5)';
    for(let y=0;y<size;y+=64)for(let x=0;x<size;x+=64){
      hx.beginPath();hx.arc(x+6,y+6,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+58,y+6,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+6,y+58,2.4,0,7);hx.fill();
      hx.beginPath();hx.arc(x+58,y+58,2.4,0,7);hx.fill();
    }
    for(let i=0;i<16;i++){const px=Math.random()*size,py=Math.random()*size,r=6+Math.random()*22;

  // ---------------- geometry: the hall ----------------

  function buildSegment(origin,heading,run,rise,halfWidth,height,matFn,tints,opts){
    opts=opts||{};
    const pitch = rise ? -Math.atan2(rise,run) : 0;
    const Lslant = Math.hypot(run,rise);
    const group=new THREE.Group();
    group.position.set(origin.x,origin.y,origin.z);
    group.rotation.order='YXZ';
    group.rotation.set(pitch,YAW[heading],0);
    scene.add(group);

    const rep=[Math.max(1,Lslant/6),2];
    const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant), matFn(rep,tints.floor));
    floorMesh.rotation.x=-Math.PI/2; floorMesh.position.set(0,0,Lslant/2); floorMesh.receiveShadow=true; group.add(floorMesh);
    const ceilMesh=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant), matFn(rep,tints.ceil));
    ceilMesh.rotation.x=Math.PI/2; ceilMesh.position.set(0,height,Lslant/2); ceilMesh.receiveShadow=true; group.add(ceilMesh);
    for(const sgn of [-1,1]){
      const wallMesh=new THREE.Mesh(new THREE.PlaneGeometry(Lslant,height), matFn(rep,tints.wall));
      wallMesh.rotation.y=sgn*Math.PI/2; wallMesh.position.set(sgn*halfWidth,height/2,Lslant/2);
      wallMesh.receiveShadow=true; wallMesh.castShadow=true; group.add(wallMesh);
    }
    if(opts.stripes){
      const stripe=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2,Lslant),
        new THREE.MeshBasicMaterial({map:stairStripeTex(opts.stripes),transparent:true,opacity:.55,depthWrite:false}));
      stripe.rotation.x=-Math.PI/2; stripe.position.set(0,0.015,Lslant/2); group.add(stripe);
    }
    return group;
  }

  function addChain(parent, lx, lz, ceilingY, len, color){

      grp.add(link);
    }
    chainGroups.push(grp);
    return grp;
  }

  // floor/ceiling blood pool — same random splatter texture, laid flat instead of
  // mounted on a wall. A random z-spin keeps repeated pools from looking identical.
  function addBloodPool(parent, lx, ly, lz, w, h, onCeiling){
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({map:bloodTex(),transparent:true,depthWrite:false}));
    mesh.position.set(lx,ly,lz);
    mesh.rotation.x = onCeiling ? Math.PI/2 : -Math.PI/2;

  // scatter n wall-mounted blood decals along a straight segment's local z-range.
  // skipZ(z) can veto a z (e.g. across a junction gap with no wall behind it) —
  // it re-rolls a few times rather than just leaving that decal out.
  function scatterBloodWalls(parent, zFrom, zTo, halfWidth, height, n, skipZ){
    for(let i=0;i<n;i++){
      let z, tries=0;
      do{ z=zFrom+Math.random()*(zTo-zFrom); tries++; } while(skipZ && skipZ(z) && tries<12);
      if(skipZ && skipZ(z)) continue;
      const s=Math.random()<0.5?-1:1;
      const w=1.5+Math.random()*2.0, h=1.8+Math.random()*2.4;
      addBloodDecal(parent, s*(halfWidth-0.02), height*(0.3+Math.random()*0.45), z, s>0?-Math.PI/2:Math.PI/2, w,h);
    }
  }
  function scatterBloodFloorCeil(parent, zFrom, zTo, halfWidth, height, nFloor, nCeil){

      const x=(Math.random()-.5)*halfWidth*1.7, z=zFrom+Math.random()*(zTo-zFrom);
      const w=1.6+Math.random()*2.2, h=1.6+Math.random()*2.2;
      addBloodPool(parent, x, 0.035, z, w, h, false);
    }
    for(let i=0;i<nCeil;i++){
      const x=(Math.random()-.5)*halfWidth*1.7, z=zFrom+Math.random()*(zTo-zFrom);
      const w=1.5+Math.random()*2.0, h=1.5+Math.random()*2.0;
      addBloodPool(parent, x, height-0.035, z, w, h, true);
    }
  }

  function addPipeRun(parent, lengthZ, lx, ly, radius){

    return pipe;
  }

  function addSteamPuffs(parent, count, spanZ, halfWidth, ceilY){
    const pos=new Float32Array(count*3);
    for(let i=0;i<count;i++){ pos[i*3]=(Math.random()-.5)*halfWidth*1.4; pos[i*3+1]=Math.random()*ceilY*0.7; pos[i*3+2]=Math.random()*spanZ; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({size:0.6,map:steamT,color:0xcfcfcf,transparent:true,opacity:.32,depthWrite:false});
    const pts=new THREE.Points(geo,mat); parent.add(pts);
    steamSystems.push({geo,count,spanZ,halfWidth,ceilY});
  }

  // mounted wall torch (bracket + flame sprite + flicker light) — matches the
  // main-hall torches so it reads as the same fixture, just relit for the wings.
  // side: -1 (left wall) or 1 (right wall); lx/ly/lz are the wall-mount point.
  function addTorch(parent, lx, ly, lz, side, color){
    color = color || 0xff7a30;
    const bracket=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,0.5,6),new THREE.MeshStandardMaterial({color:0x120a06,roughness:.9}));
    bracket.position.set(lx,ly,lz); bracket.rotation.z=side*0.5; parent.add(bracket);
    const fl=new THREE.Sprite(new THREE.SpriteMaterial({map:flameT,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    fl.position.set(lx-side*0.15,ly+0.35,lz); fl.scale.set(0.9,1.3,1); parent.add(fl);
    const pl=new THREE.PointLight(color,2.0,15,2); pl.position.set(lx-side*0.15,ly+0.4,lz); parent.add(pl);
    torchLights.push({pl,base:2.0}); flames.push({fl,base:1.15,y:ly+0.35});
  }

  // flat, unlit-detail red material for the blank red rooms — no texture map,
  // just a solid tint so the room reads as "completely blank" per the brief.
  function redMat(rep, tint){
    return new THREE.MeshStandardMaterial({color: tint||0xb30000, roughness:.85, metalness:.05});
  }

  // dark, glassy obsidian material for the final chamber — low roughness +
  // high metalness gives it a wet-looking sheen under the point lights
  // without needing actual environment-map reflections.
  function obsidianMat(rep, tint){
    return new THREE.MeshStandardMaterial({color: tint||0x0d0410, roughness:.18, metalness:.72});
  }

  // seals off the far end of a red room with an ornate box set into the wall —
  // a placeholder "door" for now (static), meant to later rise open. DoubleSide
  // on both meshes so it's guaranteed visible regardless of which way the room
  // is entered, since this is the true dead end of the level.
  function addEndDoor(parent, len, halfWidth, height, tex){
    const cap=new THREE.Mesh(new THREE.PlaneGeometry(halfWidth*2, height),
      new THREE.MeshStandardMaterial({color:0x4a0000, roughness:.85, metalness:.05, side:THREE.DoubleSide}));
    cap.rotation.y=Math.PI; cap.position.set(0, height/2, len-0.03);
    parent.add(cap);
    const doorW=Math.min(halfWidth*1.5, 3.4), doorH=doorW*(646/672);
    const doorMat=new THREE.MeshStandardMaterial({map:tex, roughness:.45, metalness:.35,
      emissive:0x2a1400, emissiveIntensity:.22, side:THREE.DoubleSide});
    const door=new THREE.Mesh(new THREE.PlaneGeometry(doorW, doorH), doorMat);
    door.rotation.y=Math.PI; door.position.set(0, height*0.48, len-0.08);
    parent.add(door);
    const gl=new THREE.PointLight(0xffaa44, 1.6, 11, 2);
    gl.position.set(0, height*0.5, len-0.9);
    parent.add(gl);
    return door;
  }

  function addBloodDrips(parent, count, spanZ, halfWidth, ceilY, color, tex){
    const pos=new Float32Array(count*3), vel=new Float32Array(count);
    for(let i=0;i<count;i++){ pos[i*3]=(Math.random()-.5)*halfWidth*1.6; pos[i*3+1]=ceilY*(0.5+Math.random()*0.5); pos[i*3+2]=Math.random()*spanZ; vel[i]=0.6+Math.random()*1.0; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({size:0.05,map:tex||dropTex,color:color||0xffffff,transparent:true,opacity:.9,depthWrite:false});
    const pts=new THREE.Points(geo,mat); parent.add(pts);
    dripSystems.push({geo,count,vel,ceilY,spanZ,halfWidth});
  }

  // ---- obstacle generation ----
  function addObstacle(parent, x, y, z, type, halfWidth){
    const obstMat=new THREE.MeshStandardMaterial({color:0x3a2820,roughness:.8,metalness:.1});
    let mesh;
    if(type==='box'){
      mesh=new THREE.Mesh(new THREE.BoxGeometry(1.2+Math.random()*0.8, 1.0+Math.random()*1.0, 0.9+Math.random()*0.6), obstMat);
      mesh.position.set(x,y,z); mesh.rotation.z=Math.random()*Math.PI;
      mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh);
    } else if(type==='debris'){
      const w=0.6+Math.random()*0.8, h=0.3+Math.random()*0.5, d=0.5+Math.random()*0.7;
      mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), obstMat);
      mesh.position.set(x,y,z); mesh.rotation.z=Math.random()*Math.PI;
      mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh);
    } else if(type==='barrel'){
      mesh=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.4,1.2,8), obstMat);
      mesh.position.set(x,y,z); mesh.rotation.z=Math.random()*Math.PI;
      mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh);
    } else if(type==='coffin'){
      // a mossy stone coffin resting on a low plinth — crypt-specific dressing
      const grp=new THREE.Group(); grp.position.set(x,y,z); grp.rotation.y=Math.random()*Math.PI*2;
      const plinthMat=new THREE.MeshStandardMaterial({color:0x2a2e26,roughness:.95,metalness:.03});
      const lidMat=new THREE.MeshStandardMaterial({color:0x363c30,roughness:.9,metalness:.05});
      const plinth=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.3,0.9), plinthMat);
      plinth.position.y=0.15; plinth.castShadow=true; plinth.receiveShadow=true; grp.add(plinth);
      const lid=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.35,0.8), lidMat);
      lid.position.y=0.48; lid.castShadow=true; lid.receiveShadow=true; grp.add(lid);
      parent.add(grp);
    } else if(type==='spikes'){
      // small cluster of dark floor spikes — paired with a 'spike' hazard zone
      const grp=new THREE.Group(); grp.position.set(x,y,z);
      const spikeMat=new THREE.MeshStandardMaterial({color:0x14100c,roughness:.6,metalness:.3});
      for(let i=0;i<5;i++){
        const sp=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.55+Math.random()*0.3,6), spikeMat);
        sp.position.set((Math.random()-.5)*0.7,0.28,(Math.random()-.5)*0.7);
        sp.rotation.z=(Math.random()-.5)*0.15; sp.castShadow=true; grp.add(sp);
      }
      parent.add(grp);
    }
    return mesh;
  }

  // ---- hazard system — invisible trigger zones tied to visible obstacles.
  // 'slow'  — player movement speed is reduced while inside (water, rubble).
  // 'spike' — a brief pain flash + stinger sound on entry, with a cooldown
  //           so it doesn't spam while the player lingers.
  const hazards=[]; // {x,z,r,type,world:THREE.Group (for converting local->world), lastHit}
  function addHazard(worldX, worldZ, r, type){
    hazards.push({x:worldX, z:worldZ, r, type, lastHit:-999});
  }
  // helper: hazards are declared in a segment's LOCAL space at build time,
  // but segments can be rotated/offset (stairs, turns) — so hazards must be
  // registered with final WORLD coordinates. For our new wings (crypt is a
  // flat, unrotated +X corridor; obsidian chamber is a flat, unrotated -Z
  // continuation) local and world coordinates share a simple offset, so the
  // call sites below just compute world coords directly rather than adding
  // a full matrix-transform helper.

  // (shadow-figure system removed — Parker felt they looked "ridiculous";
  // blood splatter/gore and the hazard system below stay.)

  // ---- wing constants ----
  const CAVE_HW=4.0, CAVE_H=5.4, CAVE_LEN=26;
  const BOIL_HW=4.2, BOIL_H=5.6, BOIL_LEN=26;
  const STAIR_LEN=12, STAIR_RISE=3.4;
  const HALLC_LEN=24, HALLE_LEN=24;
  const REDC_LEN=20, REDE_LEN=20; // blank red rooms tacked onto the end of each wing
  const CENTER_LEN=22; // new center corridor connecting the junction
  const CRYPT_HW=3.6, CRYPT_H=5.0, CRYPT_LEN=22; // flooded crypt, off JZ3 on the right
  const OBSID_HW=4.2, OBSID_H=6.6, OBSID_LEN=18; // obsidian chamber, continues past the center corridor

  // Data-driven zones array — declared here (before any wings are built) so
  // both the original wings AND the 20 new rooms below can register into it
  // as they're built. resolvePosition() (defined later, near player input)
  // just walks this array; the same array also feeds the minimap.
  const ZM=0.7; // default wall clearance margin
  const zones=[];
  function addZone(x0,x1,z0,z1, elev, zoneName, hint, margins){
    const mg=margins||{};
    zones.push({
      x0:Math.min(x0,x1), x1:Math.max(x0,x1), z0:Math.min(z0,z1), z1:Math.max(z0,z1),
      mx0: mg.mx0!=null?mg.mx0:ZM, mx1: mg.mx1!=null?mg.mx1:ZM,
      mz0: mg.mz0!=null?mg.mz0:ZM, mz1: mg.mz1!=null?mg.mz1:ZM,
      elev, zone:zoneName, hint: hint||null
    });
    return zones[zones.length-1];
  }
  const DIR=[{dx:0,dz:-1},{dx:1,dz:0},{dx:0,dz:1},{dx:-1,dz:0}]; // matches YAW[] heading indices

  const caveTurnX = -HW-CAVE_LEN;
  const boilTurnX =  HW+BOIL_LEN;
  const cryptTurnX = HW+CRYPT_LEN;
  const caveStairEndZ = JZ-STAIR_LEN;
  const caveHallEndZ  = caveStairEndZ-HALLC_LEN;
  const caveRedEndZ   = caveHallEndZ-REDC_LEN;
  const boilStairEndZ = JZ-STAIR_LEN;
  const boilHallEndZ  = boilStairEndZ-HALLE_LEN;
  const boilRedEndZ   = boilHallEndZ-REDE_LEN;

  // --- LEFT WING: cave, chains ---
  const caveCorridorGrp = buildSegment({x:-HW,y:0,z:JZ}, 3, CAVE_LEN, 0, CAVE_HW, CAVE_H, caveMat,
    {floor:0x3c3630,ceil:0x121614,wall:0x2a2c26});
  for(let i=1;i<=5;i++) addChain(caveCorridorGrp, (i%2?-1:1)*(CAVE_HW-1.1), i*(CAVE_LEN/6), CAVE_H, 1.3+Math.random()*0.6);

  const caveStairGrp = buildSegment({x:caveTurnX,y:0,z:JZ}, 0, STAIR_LEN, STAIR_RISE, CAVE_HW, CAVE_H, caveMat,
    {floor:0x322e28,ceil:0x121614,wall:0x282a24}, {stripes:16});
  addChain(caveStairGrp, -(CAVE_HW-1.1), STAIR_LEN*0.3, CAVE_H, 1.1);
  addChain(caveStairGrp, (CAVE_HW-1.1), STAIR_LEN*0.7, CAVE_H, 1.1);

  const caveHallGrp = buildSegment({x:caveTurnX,y:STAIR_RISE,z:caveStairEndZ}, 0, HALLC_LEN, 0, CAVE_HW, CAVE_H, caveMat,
    {floor:0x3c3630,ceil:0x121614,wall:0x2a2c26});
  for(let i=1;i<=4;i++) addChain(caveHallGrp, (i%2?-1:1)*(CAVE_HW-1.1), i*(HALLC_LEN/5), CAVE_H, 1.2+Math.random()*0.8);
  // dim cool glow accents down the cave wing (steady, not fire-flicker)
  for(const grp of [caveCorridorGrp,caveHallGrp]){
    for(let i=1;i<=2;i++){
      const gl=new THREE.PointLight(0x2a6a5a,0.55,9,2);
      gl.position.set((i%2?-1:1)*1.2, CAVE_H-0.6, (grp===caveCorridorGrp?CAVE_LEN:HALLC_LEN)*(i/3));
      grp.add(gl);
    }
  }
  // a real wall torch in each cave segment for extra warm light against the cold rock glow
  // (z offsets picked to clear the hanging chains rather than sit right behind one)
  addTorch(caveCorridorGrp, (CAVE_HW-1.0), 3.1, CAVE_LEN*0.25, 1);
  addTorch(caveHallGrp,      (CAVE_HW-1.0), 3.1, HALLC_LEN*0.55, 1);
  // blood splatter through the cave wing too, same as everywhere else
  scatterBloodWalls(caveCorridorGrp, 0, CAVE_LEN, CAVE_HW, CAVE_H, 6);
  scatterBloodFloorCeil(caveCorridorGrp, 0, CAVE_LEN, CAVE_HW, CAVE_H, 4, 3);
  scatterBloodWalls(caveStairGrp, 0, STAIR_LEN, CAVE_HW, CAVE_H, 3);
  scatterBloodFloorCeil(caveStairGrp, 0, STAIR_LEN, CAVE_HW, CAVE_H, 2, 2);
  scatterBloodWalls(caveHallGrp, 0, HALLC_LEN, CAVE_HW, CAVE_H, 6);
  scatterBloodFloorCeil(caveHallGrp, 0, HALLC_LEN, CAVE_HW, CAVE_H, 4, 3);

  // cave obstacles — collapsed chunks, hazards
  for(let i=0;i<4;i++){
    const obstZ=CAVE_LEN*(0.25+i*0.18);
    addObstacle(caveCorridorGrp, (Math.random()-.5)*5.2, 0.4, obstZ, (i%2?'box':'debris'), CAVE_HW);
  }
  // cracked cave floor
  const caveCrackFloor=new THREE.Mesh(new THREE.PlaneGeometry(CAVE_HW*2,CAVE_LEN),
    new THREE.MeshBasicMaterial({map:floorCrackTex(), transparent:true, opacity:.25, depthWrite:false}));
  caveCrackFloor.rotation.x=-Math.PI/2; caveCrackFloor.position.set(0,0.04,CAVE_LEN/2);
  caveCorridorGrp.add(caveCrackFloor);

  // --- cave wing continues past the hallway into a blank red room: solid red
  // floor/walls/ceiling, no texture, no props — just longer gray chains overhead ---
  const caveRedGrp = buildSegment({x:caveTurnX,y:STAIR_RISE,z:caveHallEndZ}, 0, REDC_LEN, 0, CAVE_HW, CAVE_H, redMat,
    {floor:0x7a0000,ceil:0x4a0000,wall:0xb30000});
  for(let i=1;i<=4;i++) addChain(caveRedGrp, (i%2?-1:1)*(CAVE_HW-1.1), i*(REDC_LEN/5), CAVE_H, 2.8+Math.random()*1.0, 0x9a9a9a);
  // (dead end door moved past 5 new cave-side rooms, below)

  // --- RIGHT WING: boiler room, pipes, blood ---
  const boilCorridorGrp = buildSegment({x:HW,y:0,z:JZ}, 1, BOIL_LEN, 0, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x362e26,ceil:0x18120e,wall:0x2e2620});
  addPipeRun(boilCorridorGrp, BOIL_LEN, -(BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addPipeRun(boilCorridorGrp, BOIL_LEN,  (BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addBloodDecal(boilCorridorGrp, -(BOIL_HW-0.02), BOIL_H*0.62, BOIL_LEN*0.28, Math.PI/2, 2.6,3.4);
  addBloodDecal(boilCorridorGrp,  (BOIL_HW-0.02), BOIL_H*0.58, BOIL_LEN*0.62, -Math.PI/2, 2.2,3.0);
  addBloodDecal(boilCorridorGrp, 0, BOIL_H-0.02, BOIL_LEN*0.45, Math.PI/2, 2.0,2.0);
  addSteamPuffs(boilCorridorGrp, 40, BOIL_LEN, BOIL_HW, BOIL_H);
  addBloodDrips(boilCorridorGrp, 50, BOIL_LEN, BOIL_HW, BOIL_H);

  const boilStairGrp = buildSegment({x:boilTurnX,y:0,z:JZ}, 0, STAIR_LEN, -STAIR_RISE, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x2c2620,ceil:0x18120e,wall:0x261f1a}, {stripes:16});
  addBloodDecal(boilStairGrp, -(BOIL_HW-0.02), BOIL_H*0.5, STAIR_LEN*0.5, Math.PI/2, 2.0,2.6);

  const boilHallGrp = buildSegment({x:boilTurnX,y:-STAIR_RISE,z:boilStairEndZ}, 0, HALLE_LEN, 0, BOIL_HW, BOIL_H, boilerMat,
    {floor:0x362e26,ceil:0x18120e,wall:0x2e2620});
  addPipeRun(boilHallGrp, HALLE_LEN, -(BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addPipeRun(boilHallGrp, HALLE_LEN,  (BOIL_HW-0.5), BOIL_H-0.55, 0.14);
  addBloodDecal(boilHallGrp, -(BOIL_HW-0.02), BOIL_H*0.55, HALLE_LEN*0.3, Math.PI/2, 2.4,3.2);
  addBloodDecal(boilHallGrp,  (BOIL_HW-0.02), BOIL_H*0.6, HALLE_LEN*0.7, -Math.PI/2, 2.6,3.4);
  addSteamPuffs(boilHallGrp, 34, HALLE_LEN, BOIL_HW, BOIL_H);
  addBloodDrips(boilHallGrp, 40, HALLE_LEN, BOIL_HW, BOIL_H);

  // industrial caged-bulb lights along the boiler wing (reuse the torch flicker loop)
  for(const grp of [boilCorridorGrp,boilHallGrp]){
    const len = grp===boilCorridorGrp?BOIL_LEN:HALLE_LEN;
    for(let i=1;i<=3;i++){
      const cage=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), new THREE.MeshStandardMaterial({color:0xffe9b0,emissive:0xffb050,emissiveIntensity:1.6,roughness:.4}));
      cage.position.set((i%2?-1:1)*(BOIL_HW-0.7), BOIL_H-0.4, len*(i/4));
      grp.add(cage);
      const bl=new THREE.PointLight(0xffb060,1.4,10,2);
      bl.position.copy(cage.position);
      grp.add(bl);
      torchLights.push({pl:bl,base:1.4});
    }
  }
  // an open wall torch in each boiler segment alongside the caged bulbs, for extra light
  addTorch(boilCorridorGrp, -(BOIL_HW-1.0), 3.2, BOIL_LEN*0.5, -1);
  addTorch(boilHallGrp,      (BOIL_HW-1.0), 3.2, HALLE_LEN*0.55, 1);
  // a lot more blood on top of the hand-placed splashes above — walls, floor, ceiling
  scatterBloodWalls(boilCorridorGrp, 0, BOIL_LEN, BOIL_HW, BOIL_H, 7);
  scatterBloodFloorCeil(boilCorridorGrp, 0, BOIL_LEN, BOIL_HW, BOIL_H, 5, 4);
  scatterBloodWalls(boilStairGrp, 0, STAIR_LEN, BOIL_HW, BOIL_H, 3);
  scatterBloodFloorCeil(boilStairGrp, 0, STAIR_LEN, BOIL_HW, BOIL_H, 2, 2);
  scatterBloodWalls(boilHallGrp, 0, HALLE_LEN, BOIL_HW, BOIL_H, 7);
  scatterBloodFloorCeil(boilHallGrp, 0, HALLE_LEN, BOIL_HW, BOIL_H, 5, 4);

  // boiler obstacles — broken pipes, debris, fallen structures
  for(let i=0;i<5;i++){
    const obstZ=BOIL_LEN*(0.2+i*0.15);
    const side=i%2?1:-1;
    addObstacle(boilCorridorGrp, side*(2.2+Math.random()*0.8), 0.5, obstZ, (i%2?'box':'barrel'), BOIL_HW);
  }
  // more rubble scattered
  for(let i=0;i<6;i++){
    addObstacle(boilCorridorGrp, (Math.random()-.5)*6.0, 0.15, Math.random()*BOIL_LEN, 'debris', BOIL_HW);
  }
  // cracked boiler floor
  const boilCrackFloor=new THREE.Mesh(new THREE.PlaneGeometry(BOIL_HW*2,BOIL_LEN),
    new THREE.MeshBasicMaterial({map:floorCrackTex(), transparent:true, opacity:.3, depthWrite:false}));
  boilCrackFloor.rotation.x=-Math.PI/2; boilCrackFloor.position.set(0,0.04,BOIL_LEN/2);
  boilCorridorGrp.add(boilCrackFloor);
  const boilHoleMat=new THREE.MeshBasicMaterial({color:0x120602});
  for(let i=0;i<5;i++){
    const bh=new THREE.Mesh(new THREE.CircleGeometry(0.4+Math.random()*0.5,12), boilHoleMat);
    bh.rotation.x=-Math.PI/2; bh.position.set((Math.random()-.5)*6.0, 0.01, BOIL_LEN*(0.12+i*0.18));
    boilCorridorGrp.add(bh);
  }

  // --- boiler wing continues past the hallway into a blank red room too ---
  const boilRedGrp = buildSegment({x:boilTurnX,y:-STAIR_RISE,z:boilHallEndZ}, 0, REDE_LEN, 0, BOIL_HW, BOIL_H, redMat,
    {floor:0x7a0000,ceil:0x4a0000,wall:0xb30000});
  for(let i=1;i<=4;i++) addChain(boilRedGrp, (i%2?-1:1)*(BOIL_HW-1.1), i*(REDE_LEN/5), BOIL_H, 2.8+Math.random()*1.0, 0x9a9a9a);
  // (dead end door moved past 5 new boiler-side rooms, below)

  // ---- FLOODED CRYPT: branches off the main hall at JZ3, right side ----
  const cryptGrp = buildSegment({x:HW,y:0,z:JZ3}, 1, CRYPT_LEN, 0, CRYPT_HW, CRYPT_H, stoneMat,
    {floor:0x1e2a24,ceil:0x0e1512,wall:0x35453f});
  // knee-deep water plane — translucent, sits just above the true floor
  const cryptWaterMat=new THREE.MeshStandardMaterial({color:0x1a3a35,transparent:true,opacity:.55,roughness:.15,metalness:.15,depthWrite:false});
  const cryptWater=new THREE.Mesh(new THREE.PlaneGeometry(CRYPT_HW*2-0.3,CRYPT_LEN-0.2),cryptWaterMat);
  cryptWater.rotation.x=-Math.PI/2; cryptWater.position.set(0,0.16,CRYPT_LEN/2);
  cryptGrp.add(cryptWater);
  cryptWaterMats.push(cryptWaterMat);
  // coffins scattered along the crypt as obstacles
  for(let i=0;i<5;i++){
    const cz=CRYPT_LEN*(0.12+i*0.18);
    const cx=(i%2?1:-1)*(1.0+Math.random()*1.4);
    addObstacle(cryptGrp, cx, 0.02, cz, 'coffin', CRYPT_HW);
  }
  // two spike-trap hazards along the flooded floor — visible warning (the
  // spike clusters poke up through the water) paired with a 'spike' hazard
  // zone at the same world coordinates
  const cryptSpikeZs=[CRYPT_LEN*0.38, CRYPT_LEN*0.72];
  for(const sz of cryptSpikeZs){
    addObstacle(cryptGrp, 0, 0.02, sz, 'spikes', CRYPT_HW);
    // world coords: heading 1 means local z -> world x (offset from HW), local x -> world z (offset from JZ3)
    addHazard(HW+sz, JZ3, 0.9, 'spike');
  }
  // slow-moving water hazard across most of the corridor's floor
  for(let i=0;i<4;i++){
    addHazard(HW+CRYPT_LEN*(0.1+i*0.26), JZ3, 3.4, 'slow');
  }
  // dim, sickly green-blue lighting + steady ceiling drips (reuse steam/drip
  // systems with crypt-appropriate colors)
  for(let i=0;i<3;i++){
    const gl=new THREE.PointLight(0x2a5a4a, 0.5, 9, 2);
    gl.position.set((i%2?-1:1)*1.6, CRYPT_H-0.7, CRYPT_LEN*(i/2.5));
    cryptGrp.add(gl);
  }
  addBloodDrips(cryptGrp, 45, CRYPT_LEN, CRYPT_HW, CRYPT_H, 0xffffff, waterDropTex);

  function addWingRoom(cursor, heading, run, hw, h, matFn, tints, zoneName, hint, dress, isFinal){
    const grp=buildSegment({x:cursor.x,y:cursor.y,z:cursor.z}, heading, run, 0, hw, h, matFn, tints);
    const d=DIR[heading];
    const endX=cursor.x+d.dx*run, endZ=cursor.z+d.dz*run;

    // the end connecting back to the PREVIOUS room always stays open (0);
    // the far end is open too UNLESS this is the true dead end of the chain
    // (isFinal), in which case it gets a real wall margin — that's where
    // sealWingEnd()'s addEndDoor sits.
    const farM = isFinal ? ZM : 0;
    if(heading===0||heading===2){
      x0=cursor.x-hw; x1=cursor.x+hw;
      z0=Math.min(cursor.z,endZ); z1=Math.max(cursor.z,endZ);
      margins = d.dz<0 ? {mz0:farM,mz1:0} : {mz0:0,mz1:farM};
    } else {
      z0=cursor.z-hw; z1=cursor.z+hw;
      x0=Math.min(cursor.x,endX); x1=Math.max(cursor.x,endX);
      margins = d.dx<0 ? {mx0:farM,mx1:0} : {mx0:0,mx1:farM};
    }
    addZone(x0,x1,z0,z1, cursor.y, zoneName, hint||null, margins);
    if(dress) dress(grp, run, hw, h);
    cursor.x=endX; cursor.z=endZ; cursor.heading=heading;
    return grp;
  }

  }

    scatterBloodWalls(grp, 0, run, hw, h, 5);

    // and touch devices never have it), so Esc always works. openPause()/
    // resumeGame() each guard on `mode` (only open from 'play', only

    if(e.key==='Escape'){

  // ---------------- save / resume (localStorage) ----------------
  const SAVE_KEY='hellscapeSave';
  function writeSave(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        x:player.x, z:player.z, yaw:player.yaw, pitch:player.pitch,
        elapsed: clock?clock.elapsedTime:0, ts: Date.now()
      }));
    }catch(e){}
  }
  function readSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }
  function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
  function refreshSaveInfo(){
    const s=readSave();
    if(s){ btnResumeSaved.disabled=false; pauseSaveInfo.textContent='Saved '+new Date(s.ts).toLocaleString(); }
    else { btnResumeSaved.disabled=true; pauseSaveInfo.textContent='No saved game yet'; }

  function resumeSavedGame(){
    const s=readSave(); if(!s)return;

    resumeGame();
  }

  // ---------------- minimap ----------------
  // Drawn straight from the same `zones` array resolvePosition() uses, so it
  // can never drift out of sync with the actual walkable geometry.
  function drawMinimap(){
    const cv=document.getElementById('minimapCanvas'), c2=cv.getContext('2d');
    const W=cv.width,H=cv.height;
    c2.fillStyle='#0a0503'; c2.fillRect(0,0,W,H);
    const allRects=zones.concat([{x0:-HW,x1:HW,z0:ZEND,z1:3.2}]); // include the main hall
    let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
    for(const zn of allRects){ minX=Math.min(minX,zn.x0);maxX=Math.max(maxX,zn.x1);minZ=Math.min(minZ,zn.z0);maxZ=Math.max(maxZ,zn.z1); }
    const pad=20, spanX=Math.max(1,maxX-minX), spanZ=Math.max(1,maxZ-minZ);
    const scale=Math.min((W-pad*2)/spanX,(H-pad*2)/spanZ);
    const toPx=(x,z)=>[pad+(x-minX)*scale, pad+(z-minZ)*scale];
    c2.strokeStyle='rgba(255,140,80,.65)'; c2.fillStyle='rgba(120,50,20,.4)'; c2.lineWidth=1;
    for(const zn of allRects){
      const p0=toPx(zn.x0,zn.z0), p1=toPx(zn.x1,zn.z1);
      c2.fillRect(p0[0],p0[1],p1[0]-p0[0],p1[1]-p0[1]);
      c2.strokeRect(p0[0],p0[1],p1[0]-p0[0],p1[1]-p0[1]);
    }
    // player marker + facing (matches the forward-vector sign convention
    // used by the movement code below: forward = (-sin(yaw), -cos(yaw)))
    const pp=toPx(player.x,player.z);
    const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw);
    c2.strokeStyle='#ff5a2a'; c2.lineWidth=2.5;
    c2.beginPath(); c2.moveTo(pp[0],pp[1]); c2.lineTo(pp[0]+fx*16,pp[1]+fz*16); c2.stroke();
    c2.fillStyle='#ffd9b0'; c2.beginPath(); c2.arc(pp[0],pp[1],5,0,Math.PI*2); c2.fill();
  }
  function openMinimap(){
    minimapOverlay.classList.remove('hidden');
    drawMinimap();
  }

  // ---------------- mobile / touch controls ----------------
  // No pointer lock on touch devices — a left-side drag joystick drives
  // movement, a right-side drag area drives look, plus dedicated jump and
  // pause buttons. Desktop keyboard/mouse controls are untouched.
  const touchControlsEl=document.getElementById('touchControls');
  const touchPauseEl=document.getElementById('touchPause');
  const touchMoveVec={x:0,z:0};
  if(isTouch){
    touchControlsEl.classList.add('active');
    touchPauseEl.classList.add('active');
    const ctrlsEl=document.querySelector('.ctrls');
    if(ctrlsEl) ctrlsEl.textContent='DRAG LEFT — MOVE   ·   DRAG RIGHT — LOOK   ·   JUMP / MENU BUTTONS';

    const touchMoveEl=document.getElementById('touchMove'), touchLookEl=document.getElementById('touchLook');
    const touchStickEl=document.getElementById('touchStick'), touchKnob=touchStickEl.querySelector('.knob');
    const touchJumpEl=document.getElementById('touchJump');
    let moveId=null, moveStartX=0, moveStartY=0;
    touchMoveEl.addEventListener('touchstart',e=>{
      const t=e.changedTouches[0]; moveId=t.identifier; moveStartX=t.clientX; moveStartY=t.clientY;
      touchStickEl.style.left=Math.max(10,t.clientX-44)+'px'; touchStickEl.style.bottom=Math.max(10,innerHeight-t.clientY-44)+'px';
      e.preventDefault();
    },{passive:false});
    touchMoveEl.addEventListener('touchmove',e=>{
      for(const t of e.changedTouches){
        if(t.identifier!==moveId) continue;
        let dx=t.clientX-moveStartX, dy=t.clientY-moveStartY;
        const maxR=48, len=Math.hypot(dx,dy);
        if(len>maxR){ dx=dx/len*maxR; dy=dy/len*maxR; }
        touchMoveVec.x=dx/maxR; touchMoveVec.z=-dy/maxR;
        touchKnob.style.transform='translate('+dx+'px,'+dy+'px)';
      }
      e.preventDefault();
    },{passive:false});
    function endMove(e){
      for(const t of e.changedTouches){ if(t.identifier===moveId){ moveId=null; touchMoveVec.x=0; touchMoveVec.z=0; touchKnob.style.transform='translate(0,0)'; } }
    }
    touchMoveEl.addEventListener('touchend',endMove); touchMoveEl.addEventListener('touchcancel',endMove);

    let lookId=null, lastX=0, lastY=0;
    touchLookEl.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; lookId=t.identifier; lastX=t.clientX; lastY=t.clientY; e.preventDefault(); },{passive:false});
    touchLookEl.addEventListener('touchmove',e=>{
      for(const t of e.changedTouches){
        if(t.identifier!==lookId) continue;
        const dx=t.clientX-lastX, dy=t.clientY-lastY; lastX=t.clientX; lastY=t.clientY;
        if(mode==='play'){
          player.yaw-=dx*0.0034*mouseSens; player.pitch-=dy*0.0034*mouseSens;
          player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch));
        }
      }
      e.preventDefault();
    },{passive:false});
    function endLook(e){ for(const t of e.changedTouches){ if(t.identifier===lookId) lookId=null; } }
    touchLookEl.addEventListener('touchend',endLook); touchLookEl.addEventListener('touchcancel',endLook);

    touchJumpEl.addEventListener('touchstart',e=>{ keys[' ']=true; e.preventDefault(); },{passive:false});
    touchJumpEl.addEventListener('touchend',e=>{ keys[' ']=false; e.preventDefault(); },{passive:false});
    touchJumpEl.addEventListener('touchcancel',e=>{ keys[' ']=false; },{passive:false});
  }
  touchPauseEl.addEventListener('click',()=>{ if(mode==='play') openPause(); else if(mode==='paused') resumeGame(); });

  // ---------------- movement / collision across the branching wings ----------------
  // Data-driven zones: each entry is a bounding rect (x0..x1, z0..z1) plus
  // per-side clearance margins (mx0/mx1/mz0/mz1 — 0 means "open doorway that
  // continues into the next zone", M means "real wall here"), an elevation
  // (constant or a function of the clamped position, for slopes/stairs), a
  // zone name, and an optional one-time hint. resolvePosition() just walks
  // this array — new rooms are added by pushing more entries (see the 20
  // new rooms below) rather than growing an if/else chain. The same array
  // powers the minimap.
  const M=ZM; // alias — original name used throughout this section
  // (centerHW / obsidEndZ declared earlier, right after the obsidian chamber
  // was built, since the new obsidian-wing rooms need obsidEndZ too)

  // obsidian chamber — no longer the dead end (continues into 5 new rooms), both z ends open
  addZone(-OBSID_HW,OBSID_HW, obsidEndZ,centerEndZ, -1.8, 'obsidian',
    {key:'obsidian',text:'THE STONE HERE DRINKS THE LIGHT'}, {mz0:0,mz1:0});
  // center corridor — descends from the junction, both ends open (connects hall <-> obsidian)
  addZone(-centerHW,centerHW, centerEndZ,JZ, (cx,cz)=>-((JZ-cz)/CENTER_LEN)*1.8, 'center',
    {key:'center',text:'A DARK PATH DESCENDS'}, {mz0:0,mz1:0});
  // flooded crypt — no longer the dead end (continues into 5 new rooms), both x ends open
  addZone(HW,cryptTurnX, JZ3-CRYPT_HW,JZ3+CRYPT_HW, 0, 'crypt',
    {key:'crypt',text:'COLD WATER CLOSES AROUND YOUR ANKLES'}, {mx0:0,mx1:0});
  // cave stairs
  addZone(caveTurnX-CAVE_HW,caveTurnX+CAVE_HW, caveStairEndZ,JZ,
    (cx,cz)=>((JZ-cz)/STAIR_LEN)*STAIR_RISE, 'cave', {key:'caveStairs',text:'THE PASSAGE CLIMBS'}, {mz0:0,mz1:0});
  // cave hallway C
  addZone(caveTurnX-CAVE_HW,caveTurnX+CAVE_HW, caveHallEndZ,caveStairEndZ, STAIR_RISE, 'cave', null, {mz0:0,mz1:0});
  // cave red room — no longer the dead end, both z ends open
  addZone(caveTurnX-CAVE_HW,caveTurnX+CAVE_HW, caveRedEndZ,caveHallEndZ, STAIR_RISE, 'cave',
    {key:'caveRed',text:'A ROOM SOAKED IN RED'}, {mz0:0,mz1:0});
  // cave corridor B — open at the -HW end (into the main-hall junction gap)
  addZone(caveTurnX,-HW, JZ-CAVE_HW,JZ+CAVE_HW, 0, 'cave',
    {key:'cave',text:'A DAMP PASSAGE, CHAINS OVERHEAD'}, {mx1:0});
  // boiler stairs
  addZone(boilTurnX-BOIL_HW,boilTurnX+BOIL_HW, boilStairEndZ,JZ,
    (cx,cz)=>-((JZ-cz)/STAIR_LEN)*STAIR_RISE, 'boiler', {key:'boilStairs',text:'THE PASSAGE DESCENDS'}, {mz0:0,mz1:0});
  // boiler hallway E
  addZone(boilTurnX-BOIL_HW,boilTurnX+BOIL_HW, boilHallEndZ,boilStairEndZ, -STAIR_RISE, 'boiler', null, {mz0:0,mz1:0});
  // boiler red room — no longer the dead end, both z ends open
  addZone(boilTurnX-BOIL_HW,boilTurnX+BOIL_HW, boilRedEndZ,boilHallEndZ, -STAIR_RISE, 'boiler',
    {key:'boilRed',text:'A ROOM SOAKED IN RED'}, {mz0:0,mz1:0});
  // boiler corridor D — open at the HW end (into the main-hall junction gap)
  addZone(HW,boilTurnX, JZ-BOIL_HW,JZ+BOIL_HW, 0, 'boiler',
    {key:'boiler',text:'METAL GROANS AROUND YOU'}, {mx0:0});

  function resolvePosition(nx,nz){
    for(let i=0;i<zones.length;i++){
      const zn=zones[i];
      if(nx>=zn.x0-0.001 && nx<=zn.x1+0.001 && nz>=zn.z0-0.001 && nz<=zn.z1+0.001){
        const cx=Math.max(zn.x0+zn.mx0, Math.min(zn.x1-zn.mx1, nx));
        const cz=Math.max(zn.z0+zn.mz0, Math.min(zn.z1-zn.mz1, nz));
        const y = typeof zn.elev==='function' ? zn.elev(cx,cz) : zn.elev;
        if(zn.hint) showHint(zn.hint.key, zn.hint.text);
        return {x:cx, z:cz, y, zone:zn.zone};
      }
    }
    // default: main hall A
    // near a junction the side wall has a gap (no inner wall there) so the
    // player must be able to walk all the way out to the wall line — clamping
    // to the usual -0.9 margin here would create an invisible wall exactly
    // where the opening is and block the turn into the wing. There are two
    // junctions on this hall: JZ (both walls open, cave-left/boiler-right)
    // and JZ3 (right wall ONLY — the flooded crypt branch, the very first
    // right-hand hallway near the start). The crypt zone's rect starts
    // exactly at x=HW, so without widening the clamp near JZ3 too, the
    // player could never actually reach x=HW there and would be pushed back
    // by this same "solid wall" default — that was the bug blocking the
    // first right-hand hallway.
    const inGapZmain = nz>JZ-GAPH-0.5 && nz<JZ+GAPH+0.5;   // both walls open
    const inGapZ3 = nz>JZ3-GAPH3-0.5 && nz<JZ3+GAPH3+0.5;  // right wall only
    // must reach past HW (the wing-corridor rects trigger at |x|>=HW) with
    // room to spare — per-frame movement steps are small, so a margin that
    // stops even slightly short of HW creates a dead zone the player can
    // never step across, which is exactly what was still blocking the turn.
    const hxPos = (inGapZmain||inGapZ3) ? HW+1.5 : HW-0.9; // right side: open at JZ and JZ3
    const hxNeg = inGapZmain ? HW+1.5 : HW-0.9;             // left side: open at JZ only
    const cx=Math.max(-hxNeg,Math.min(hxPos,nx));
    const cz=Math.max(ZEND+2.4,Math.min(3.2,nz));
    if(cz<JZ+GAPH+2 && cz>JZ-GAPH-2 && !hintShown.junction){ showHint('junction','THE HALL SPLITS — LEFT OR RIGHT'); }
    return {x:cx,z:cz,y:0,zone:'hall'};
  }

  // ---------------- audio ----------------
  // Procedural Web Audio SFX for scary moments (dissonant tones, disturbing pitch bends)
  function scareSound(ctx, freq, duration, type){
    if(!ctx)return;
    const now=ctx.currentTime;
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq*0.4, now+duration*0.7);
    gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.08, now+0.05);
    gain.gain.linearRampToValueAtTime(0, now+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+duration);
  }
  try{ var audioCtx=new(window.AudioContext||window.webkitAudioContext)(); } catch(e){ var audioCtx=null; }
  let lastScareTime=0;
  // periodic jump scare — first one fires 20-40s in, then every 45-90s after
  let nextScareAt = 20 + Math.random()*20;

  // ---- scripted jump scare: a bright flash overlay + a loud dissonant
  // stinger. Used to be fired once by the obsidian-chamber stalker figure;
  // now fires on a randomized periodic timer during play (see animate()). ----
  let jumpScareFlash=0;
  const scareFlashEl=document.getElementById('scareFlash');
  function triggerJumpScare(){
    jumpScareFlash=1.0;
    if(scareFlashEl) scareFlashEl.style.opacity=1;
    if(audioCtx){
      const now=audioCtx.currentTime;
      for(const f of [55,80,160,240]){
        const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
        o.type='sawtooth'; o.frequency.setValueAtTime(f, now);
        gn.gain.setValueAtTime(0.2, now); gn.gain.exponentialRampToValueAtTime(0.001, now+0.55);
        o.connect(gn); gn.connect(audioCtx.destination); o.start(now); o.stop(now+0.55);
      }
    }
    lastScareTime=clock?clock.elapsedTime:0;
  }

  // ---------------- loop ----------------
  const fwd=new THREE.Vector3(), fq=new THREE.Vector3();
  const clock=new THREE.Clock(); let bob=0, gtex=0;
  const grain=document.getElementById('grain'),gctx=grain.getContext('2d');
  function sizeGrain(){grain.width=Math.floor(innerWidth/3);grain.height=Math.floor(innerHeight/3);}
  sizeGrain();addEventListener('resize',sizeGrain);
  let gframe=0;
  function drawGrain(){const w=grain.width,h=grain.height,img=gctx.createImageData(w,h),d=img.data;
    for(let i=0;i<w*h;i++){const v=Math.random()*255;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}gctx.putImageData(img,0,0);}

  let curZone='hall';
  let lastAutosave=0;
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;

    if(mode==='play'){
      // Left/right arrow keys turn the view directly — always on, every
      // frame, regardless of touch detection, pointer-lock state, or mouse
      // activity. This is the primary/reliable turn method Parker asked
      // for; mouse-look (when pointer lock is granted) still works too but
      // arrow-key turning never depends on it.
      const TURN_RATE=2.0; // radians/sec
      if(keys['arrowleft']) player.yaw+=TURN_RATE*dt;
      if(keys['arrowright']) player.yaw-=TURN_RATE*dt;

      const run=(keys['shift'])?1.8:1.0;
      // hazards: a 'slow' zone (water, rubble) drags movement speed down
      // while standing in it; a 'spike' zone stings on entry with a
      // cooldown so it doesn't spam while the player lingers nearby.
      let hazardSpeedMul=1.0;
      for(const hz of hazards){
        const d=Math.hypot(player.x-hz.x, player.z-hz.z);
        if(d>hz.r) continue;
        if(hz.type==='slow'){ hazardSpeedMul=Math.min(hazardSpeedMul,0.5); }
        else if(hz.type==='spike' && t-hz.lastHit>1.4){
          hz.lastHit=t; window.__hazardHitCount=(window.__hazardHitCount||0)+1;
          const dmgEl=document.getElementById('dmg');
          dmgEl.style.opacity=1; setTimeout(()=>{dmgEl.style.opacity=0;},220);
          if(audioCtx) scareSound(audioCtx, 340, 0.22, 'square');
        }
      }
      const sp=3.2*run*hazardSpeedMul*dt;
      let mx=0,mz=0;
      if(keys['w']||keys['arrowup'])mz+=1; if(keys['s']||keys['arrowdown'])mz-=1;
      if(keys['a'])mx-=1; if(keys['d'])mx+=1;
      if(isTouch){ mx+=touchMoveVec.x; mz+=touchMoveVec.z; }
      const len=Math.hypot(mx,mz)||1; mx/=len;mz/=len;
      const sinY=Math.sin(player.yaw),cosY=Math.cos(player.yaw);
      const nx = player.x + (mx*cosY - mz*sinY)*sp;
      const nz = player.z + (-mx*sinY - mz*cosY)*sp;
      const res=resolvePosition(nx,nz);
      player.x=res.x; player.z=res.z; player.elev=res.y; curZone=res.zone;
      // reached gate? (only true when actually in the main hall near its far wall)
      if(curZone==='hall' && player.z<ZEND+2.7){ endGame('THE GATE','it will not open… not yet'); }
      // head bob
      const moving=(mx||mz);
      if(moving) bob+=dt*10*run;
      // space-bar jump: vertical velocity on press (only while grounded),
      // gravity pulls back down, lands back on the current floor elevation
      // (player.elev, from resolvePosition — so jumping still tracks stairs/slopes).
      if(keys[' '] && player.grounded){ player.vy=5.4; player.grounded=false; }
      player.vy-=15*dt;
      player.airY+=player.vy*dt;
      if(player.airY<=0){ player.airY=0; player.vy=0; player.grounded=true; }
      camera.position.set(player.x,player.elev+player.airY+EYE+Math.sin(bob)*0.06,player.z);
      camera.rotation.set(player.pitch,player.yaw,0);
      // light autosave so "Resume Saved Game" stays reasonably fresh
      if(t-lastAutosave>10){ lastAutosave=t; writeSave(); }
    } else {
      camera.position.set(player.x,player.elev+player.airY+EYE,player.z);
      camera.rotation.set(player.pitch,player.yaw,0);
    }

    // fog thickens on the way down into the boiler depths
    const targetFog = (curZone==='boiler' && player.elev<-0.6) ? FOG_DEEP : FOG_BASE;
    scene.fog.density += (targetFog-scene.fog.density)*Math.min(1,dt*0.6);

    // torch throw + fill follow camera
    camera.getWorldDirection(fwd);
    throwLight.position.copy(camera.position);
    throwLight.target.position.copy(camera.position).addScaledVector(fwd,9); throwLight.target.position.y-=1.5;
    throwLight.target.updateMatrixWorld();
    const flick=0.78+Math.sin(t*23)*0.06+Math.random()*0.16;
    throwLight.intensity=3.0*flick; torchFill.intensity=1.8*flick;
    torchFill.position.copy(camera.position).addScaledVector(fwd,0.6); torchFill.position.y-=0.2;

    // wall torches / caged bulbs flicker
    for(const T of torchLights){T.pl.intensity=T.base*(0.72+Math.sin(t*17+T.pl.position.z)*0.12+Math.random()*0.18);}
    for(const F of flames){F.fl.scale.set(0.8+Math.random()*0.2,1.15+Math.random()*0.3,1);F.fl.position.y=F.y+Math.random()*0.05;}
    // lava pulse
    lavaMat.emissiveIntensity=2.1+Math.sin(t*2.3)*0.4;
    gtex+=dt*0.03; lavaMat.emissiveMap.offset.y=gtex; lavaMat.map.offset.y=gtex;
    gateLight.intensity=2.0+Math.sin(t*3.1)*0.6; poolLight.intensity=2.0+Math.sin(t*2.0+1)*0.5;
    seamMat.opacity=0.6+Math.sin(t*4)*0.3;

    // hanging chains sway gently
    for(const c of chainGroups){ c.rotation.z=Math.sin(t*0.7+c.position.x*3+c.position.z)*0.035; c.rotation.x=Math.sin(t*0.55+c.position.z*2)*0.02; }

    // steam puffs rise and fade back to the floor
    for(const S of steamSystems){
      const arr=S.geo.attributes.position.array;
      for(let i=0;i<S.count;i++){ arr[i*3+1]+=dt*0.4; arr[i*3]+=Math.sin(t*1.2+i)*dt*0.06;
        if(arr[i*3+1]>S.ceilY*0.85){ arr[i*3+1]=0.1; arr[i*3]=(Math.random()-.5)*S.halfWidth*1.4; arr[i*3+2]=Math.random()*S.spanZ; } }
      S.geo.attributes.position.needsUpdate=true;
    }
    // blood drips fall and reset near the ceiling
    for(const D of dripSystems){
      const arr=D.geo.attributes.position.array;
      for(let i=0;i<D.count;i++){ arr[i*3+1]-=D.vel[i]*dt;
        if(arr[i*3+1]<0.05){ arr[i*3+1]=D.ceilY*(0.5+Math.random()*0.5); arr[i*3]=(Math.random()-.5)*D.halfWidth*1.6; arr[i*3+2]=Math.random()*D.spanZ; } }
      D.geo.attributes.position.needsUpdate=true;
    }

    // embers rise
    const ea=egeo.attributes.position.array;
    for(let i=0;i<EN;i++){ea[i*3+1]+=ev[i]*dt; ea[i*3]+=Math.sin(t*1.5+i)*dt*0.15; if(ea[i*3+1]>H){ea[i*3+1]=0;ea[i*3]=(Math.random()-.5)*HW*2;ea[i*3+2]=2.5-Math.random()*LEN;}}
    egeo.attributes.position.needsUpdate=true;

    // periodic random jump scare — no shadow figures anymore, so this is
    // purely time-based: fires every ~45-90s (randomized each time) while
    // actually playing, never while paused/in a menu.
    if(mode==='play' && t>=nextScareAt){
      triggerJumpScare();
      nextScareAt = t + 45 + Math.random()*45;
    }

    // jump-scare screen flash decay
    if(jumpScareFlash>0){
      jumpScareFlash=Math.max(0,jumpScareFlash-dt*1.8);
      scareFlashEl.style.opacity=jumpScareFlash;
    }

    // crypt water — subtle opacity pulse so it reads as unsettled/alive
    for(const wm of cryptWaterMats){ wm.opacity=0.5+Math.sin(t*0.8)*0.08; }
    // obsidian chamber seams pulse like the main gate's

    // occasional unsettling ambient sounds in deep zones
    if(curZone==='boiler' && player.elev<-1.0 && t-lastScareTime>2.0 && Math.random()<0.005){
      if(audioCtx) scareSound(audioCtx, 65+Math.random()*45, 0.3, 'triangle');
      lastScareTime=t;
    }
    // creepy whispers in center corridor
    if(curZone==='center' && t-lastScareTime>3.0 && Math.random()<0.004){
      if(audioCtx){
        for(let i=0;i<2;i++) scareSound(audioCtx, 200+Math.random()*150, 0.35, 'square');
      }
      lastScareTime=t;
    }
    // dripping unease in the flooded crypt
    if(curZone==='crypt' && t-lastScareTime>2.5 && Math.random()<0.006){
      if(audioCtx) scareSound(audioCtx, 500+Math.random()*300, 0.15, 'sine');
      lastScareTime=t;
    }

    if((gframe++&1)===0) drawGrain();
    renderer.render(scene,camera);
  }

  // reveal after first render
  requestAnimationFrame(()=>{ animate(); setTimeout(()=>{loadwrap.style.opacity=0;setTimeout(()=>loadwrap.style.display='none',600);},250); });
  window.__HELL={start:()=>start(), dbg:()=>{try{renderer.shadowMap.enabled=false;throwLight.castShadow=false;renderer.setPixelRatio(1);scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});}catch(e){}},
    state:()=>({x:player.x,z:player.z,elev:player.elev,zone:curZone,mode:mode,yaw:player.yaw,pitch:player.pitch}),
    teleport:(x,z)=>{player.x=x;player.z=z;},
    // testing helpers: list every registered zone's bounding rect/name so a
    // headless script can teleport to each one's centerpoint and check
    // state().zone/.elev resolve sensibly.
    zones:()=>zones.map(z=>({zone:z.zone, x0:z.x0,x1:z.x1,z0:z.z0,z1:z.z1, cx:(z.x0+z.x1)/2, cz:(z.z0+z.z1)/2})),
    pause:()=>openPause(), resume:()=>resumeGame(), jump:()=>{keys[' ']=true; setTimeout(()=>{keys[' ']=false;},80);},
    scareNow:()=>triggerJumpScare()};
})();
</script>
<script>
/* Background music — music.mp3 plays (looping) the moment the player descends.
   Mute toggle top-right. */
(function(){
  var bgm=document.getElementById('bgm'), mute=document.getElementById('mute');
  if(!bgm||!mute)return;
  var muted=true, wanted=false, blobReady=false, blobLoading=false;
  var srcUrl = bgm.getAttribute('src') || './music.mp3';
  // Pull the whole track down as a blob and play from that, instead of letting
  // the <audio> element stream it directly. A direct src stream means the
  // browser issues Range requests, and getting that wrong at the service-worker
  // layer is exactly what silently broke playback before (see sw.js) — a blob
  // URL sidesteps ranged/streamed fetching (and the SW) entirely, so this stays
  // reliable even if the caching layer changes again later.
  bgm.removeAttribute('src');
  bgm.volume=0.55;
  function reallyPlay(){ if(muted)return; var p=bgm.play(); if(p&&p.catch)p.catch(function(){}); }
  function ensureBlobThenPlay(){
    if(blobReady){ reallyPlay(); return; }
    if(blobLoading) return;
    blobLoading=true;
    fetch(srcUrl).then(function(r){ return r.blob(); })
      .then(function(b){ bgm.src=URL.createObjectURL(b); blobReady=true; blobLoading=false; if(wanted) reallyPlay(); })
      .catch(function(){ blobLoading=false; });
  }
  function descend(){ wanted=true; if(muted){muted=false; mute.classList.remove('off');} ensureBlobThenPlay(); }
  var a=document.getElementById('enterBtn'), b=document.getElementById('againBtn');
  if(a)a.addEventListener('click',descend);
  if(b)b.addEventListener('click',descend);
  mute.addEventListener('click',function(){
    muted=!muted; mute.classList.toggle('off',muted);
    if(muted){bgm.pause();} else {wanted=true; ensureBlobThenPlay();}
  });
})();
</script>
